function audio(){
  if(!somLigado) return null;
  try{
    if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    return ac;
  }catch(e){ return null; }
}

// uma nota: frequencia inicial, final, duracao, timbre, volume e atraso
function nota(f1, f2, dur, tipo, vol, atraso){
  const a = audio(); if(!a) return;
  const t = a.currentTime + (atraso||0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = tipo || 'sine';
  o.frequency.setValueAtTime(f1, t);
  if(f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.14, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.03);
}

const SONS = {
  toc:     () => nota(520, 380, .05, 'triangle', .05),
  bom:     () => { nota(660,660,.10,'triangle',.10,0); nota(880,880,.14,'triangle',.10,.08); },
  grana:   () => { [784,988,1175,1568].forEach((f,i)=>nota(f,f,.13,'triangle',.11,i*.07)); },
  entrega: () => { [523,659,784,1047].forEach((f,i)=>nota(f,f,.18,'sine',.12,i*.09)); nota(1568,1568,.5,'sine',.05,.36); },
  estrela: () => { [1047,1319,1568,2093].forEach((f,i)=>nota(f,f,.11,'sine',.09,i*.055)); },
  ruim:    () => { nota(320,120,.34,'sawtooth',.11); nota(160,70,.42,'square',.06,.04); },
  alerta:  () => { nota(440,440,.11,'square',.08,0); nota(370,370,.15,'square',.08,.14); },
  agiota:  () => { nota(180,70,.55,'sawtooth',.14); nota(90,45,.7,'square',.09,.08); nota(120,60,.5,'sawtooth',.07,.3); },
  moeda:   () => { nota(1319,1319,.07,'square',.07,0); nota(1760,1760,.13,'square',.07,.06); },
};

// ---------- confete ----------
const fx = document.getElementById('fx');
const fcx = fx.getContext('2d');
let pecas = [], fxLigado = false;
const CORES = ['#F2A03D','#4CAF7D','#4C8FD6','#E07A9B','#8E6BD9','#EFE3D0','#E0503A'];

function ajustarFx(){
  const r = fx.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  fx.width = Math.max(1, Math.round(r.width*dpr));
  fx.height = Math.max(1, Math.round(r.height*dpr));
  fcx.setTransform(dpr,0,0,dpr,0,0);
}

function festa(qtd){
  const r = fx.getBoundingClientRect();
  if(!r.width) return;
  ajustarFx();
  const n = menosMovimento() ? 14 : (qtd || 70);
  for(let i=0;i<n;i++){
    pecas.push({
      x: r.width*(.15 + Math.random()*.7),
      y: r.height*(.28 + Math.random()*.12),
      vx: (Math.random()-.5)*7,
      vy: -4.5 - Math.random()*7,
      g: .22 + Math.random()*.1,
      l: 5 + Math.random()*6,
      a: 3 + Math.random()*5,
      cor: CORES[(Math.random()*CORES.length)|0],
      rot: Math.random()*Math.PI,
      vr: (Math.random()-.5)*.35,
      vida: 1,
    });
  }
  if(!fxLigado){ fxLigado = true; requestAnimationFrame(rodarFx); }
}

function rodarFx(){
  const r = fx.getBoundingClientRect();
  fcx.clearRect(0,0,r.width,r.height);
  pecas = pecas.filter(p => p.vida > 0 && p.y < r.height + 30);
  pecas.forEach(p => {
    p.vx *= .995; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vida -= .0055;
    fcx.save();
    fcx.translate(p.x, p.y); fcx.rotate(p.rot);
    fcx.globalAlpha = Math.max(0, Math.min(1, p.vida));
    fcx.fillStyle = p.cor;
    fcx.fillRect(-p.l/2, -p.a/2, p.l, p.a);
    fcx.restore();
  });
  if(pecas.length) requestAnimationFrame(rodarFx);
  else { fcx.clearRect(0,0,r.width,r.height); fxLigado = false; }
}

let sustoTimer = null;
function susto(forte){
  const fl = document.getElementById('flash'), ap = document.getElementById('app');

    sustoTimer = setTimeout(() => ap.classList.remove('treme'), 520);
  }
}
function brilho(){
  const fl = document.getElementById('flash');
  fl.classList.remove('bate'); void fl.offsetWidth;
  fl.classList.add('bom','bate');
  setTimeout(() => fl.classList.remove('bom'), 540);

// o momento manda no efeito: cada um tem confete, cor e som próprios
function comemorar(qual){
  switch(qual){
    case 'venda':    festa(90); brilho(); som('grana'); break;
    case 'entrega':  festa(115); brilho(); som('entrega'); break;
    case 'estrela':  festa(70); brilho(); som('estrela'); break;
    case 'dinheiro': brilho(); som('moeda'); break;
    default:         brilho(); som('bom');
  }
}
function doer(qual){
  switch(qual){
    case 'agiota':     susto(true); som('agiota'); break;
    case 'travou':     susto(true); som('agiota'); break;
    case 'divida':     susto(true); som('ruim'); break;
    case 'reclamacao': susto(true); som('ruim'); break;
    default:           susto(false); som('ruim');
  }
}

function ligarSom(){
  const b = document.getElementById('btSom');
  b.textContent = somLigado ? '🔊' : '🔇';
  b.classList.toggle('mudo', !somLigado);
  b.onclick = () => {
    somLigado = !somLigado;
    try{ localStorage.setItem(K_SOM, somLigado ? 'on' : 'off'); }catch(e){}
    ligarSom();
    if(somLigado) som('bom');
  };
}

/* ---------- toast ---------- */
const EFEITOS_BONS = ['venda','entrega','estrela','dinheiro'];
function toast(txt, tipo, ms, efeito){
  // com efeito nomeado usa o dele; sem, cai no efeito padrão do tipo
  if(efeito) (EFEITOS_BONS.includes(efeito) ? comemorar : doer)(efeito);
  else if(tipo === 'v'){ brilho(); som('bom'); }
  else if(tipo === 'r'){ susto(false); som('ruim'); }
  else if(tipo === 'x') som('alerta');
  const el = document.createElement('div');
  el.className = 'toast ' + (tipo||'');
  el.innerHTML = txt;
  const box = document.getElementById('toasts');
  box.appendChild(el);
  while(box.children.length > 4) box.removeChild(box.firstChild);
  setTimeout(() => { el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 320); }, ms||4200);
}

  try{
    const r = await fetch(API + rota, Object.assign({signal: ctl.signal}, opc||{}));
    const corpo = await r.json().catch(() => ({}));
    return {ok: r.ok, status: r.status, corpo};
  }catch(e){
    return {ok: false, status: 0, corpo: {erro: 'sem rede'}};
  }finally{ clearTimeout(t); }
}
const comToken = extra => Object.assign(
  {headers: {'Content-Type':'application/json', 'Authorization': 'Bearer ' + (sessao && sessao.token)}}, extra||{});

async function testarServidor(){
  const r = await api('/status', null, 5000);
  online = !!(r.ok && r.corpo && r.corpo.ok);
  return online;
}

function erroLogin(t){ document.getElementById('loginErro').textContent = t || ''; }

function telaLogin(){
  const lp = document.getElementById('loginPerfis');
  const lf = document.getElementById('loginForm');
  erroLogin('');
  lp.innerHTML = online === false
    ? `<div class="avisoOff">O servidor não respondeu. Você joga agora e a partida fica <b>só neste aparelho</b> até a conexão voltar.</div>`
    : '';
  lf.innerHTML = `
    <label class="f">E-mail</label>
    <input type="email" id="inEmail" inputmode="email" autocomplete="username" placeholder="voce@email.com" value="${(lerSessao()||{}).email||''}">
    <label class="f">Senha</label>
    <input type="password" id="inSenha" autocomplete="${modoCriar?'new-password':'current-password'}" placeholder="${modoCriar?'pelo menos 6 caracteres':''}">
    <div class="acts"><button class="btn pri" id="btOk" style="width:100%;text-align:center;padding:12px">${modoCriar?'Criar conta e jogar':'Entrar'}</button></div>
    <button class="linkBt" id="btAlterna">${modoCriar?'Já tenho conta':'Criar uma conta'}</button>`;
  document.getElementById('btOk').onclick = enviarLogin;
  document.getElementById('inSenha').onkeydown = e => { if(e.key === 'Enter') enviarLogin(); };
  document.getElementById('btAlterna').onclick = () => { modoCriar = !modoCriar; telaLogin(); };
}

async function enviarLogin(){
  const email = (document.getElementById('inEmail').value||'').trim().toLowerCase();
  const senha = document.getElementById('inSenha').value||'';
  if(!/^[^@\s]+@[^@\s.]+\.[^@\s]{2,}$/.test(email)) return erroLogin('Escreva um e-mail válido.');
  if(senha.length < (modoCriar ? 6 : 1)) return erroLogin('A senha precisa de pelo menos 6 caracteres.');

  const bt = document.getElementById('btOk');
  bt.disabled = true; bt.textContent = 'Só um instante...';
  erroLogin('');

  if(online === null) await testarServidor();

  if(online){
    const r = await api(modoCriar ? '/criar' : '/entrar', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, senha}),
    });
    bt.disabled = false; bt.textContent = modoCriar ? 'Criar conta e jogar' : 'Entrar';
    if(!r.ok){
      if(r.status === 0){ online = false; telaLogin(); return erroLogin('O servidor não respondeu. Dá pra jogar neste aparelho mesmo assim.'); }
      return erroLogin(r.corpo.erro || 'Não deu pra entrar.');
    }
    sessao = {token: r.corpo.token, email};
    gravarSessao(sessao);
    perfilAtual = email;
    await abrirPartida();
    return;
  }

  // servidor fora: joga local, mas guarda o e-mail pra sincronizar quando voltar
  bt.disabled = false; bt.textContent = modoCriar ? 'Criar conta e jogar' : 'Entrar';
  perfilAtual = email;
  gravarSessao({email});
  const local = carregarSave(email);
  if(local){ S = local; entrarNoJogo(false); }
  else { S = novoJogo(); S.nome = email.split('@')[0]; S.ultimoMes = agora().getMonth(); entrarNoJogo(true); }
}

// escolhe entre a partida do servidor e a deste aparelho: vale a que foi mais longe
async function abrirPartida(){
  const local = carregarSave(perfilAtual);
  let nuvem = null;
  if(online && sessao && sessao.token){
    const r = await api('/save', comToken({method:'GET'}));
    if(r.ok && r.corpo && r.corpo.estado){
      try{
        const d = JSON.parse(r.corpo.estado);
        if(d && d.v === 1){ nuvem = Object.assign(novoJogo(), d); nuvem.fazendo = null; nuvem.vel = 0; }
      }catch(e){}
    } else if(r.status === 401){
      sessao = null; gravarSessao(null); online = true;
      document.getElementById('login').classList.remove('off');
      telaLogin(); return erroLogin('Sua sessão venceu. Entre de novo.');
    }
  }

  let escolhido = null, veioDaNuvem = false;
  if(nuvem && local) { escolhido = nuvem.t >= local.t ? nuvem : local; veioDaNuvem = escolhido === nuvem; }
  else if(nuvem)     { escolhido = nuvem; veioDaNuvem = true; }
  else if(local)     { escolhido = local; }

  if(escolhido){ S = escolhido; entrarNoJogo(false, veioDaNuvem); }
  else { S = novoJogo(); S.nome = perfilAtual.split('@')[0]; S.ultimoMes = agora().getMonth(); entrarNoJogo(true); }
  salvar(true);
}

function sairDaConta(){
  perfilAtual = null; sessao = null; gravarSessao(null); modoCriar = false;
  setVel(0);
  document.getElementById('login').classList.remove('off');
  telaLogin();
}

function entrarNoJogo(ehNovo, veioDaNuvem){
  document.getElementById('login').classList.add('off');
  montarAbas(); montarVel(); irPara('casa'); ajustarCanvas(); render();
  if(ehNovo){
    setVel(3);
    toast('Segunda, 9 de março, 7 da manhã. <b>R$ 12.000</b> na conta e as contas do dia 5 só daqui a 4 semanas.','v', 8000);
    setTimeout(() => toast('Toque na <b>mesa de trabalho</b> pra abrir os leads, os projetos e o suporte.','o', 8000), 2200);
  } else {
    setVel(0);
    toast('De volta ao dia '+Math.floor(S.t/24)+(veioDaNuvem?', recuperado da sua conta':'')+'. O relógio está pausado.','o', 6000);
  }
  if(online === false) setTimeout(() => toast('Jogando sem servidor: a partida fica só neste aparelho por enquanto.','x', 7000), 1200);
}

/* ---------- save ---------- */
let salvarTimer = null, mandarTimer = null, mandando = false;

function carregarSave(email){
  try{
    const raw = localStorage.getItem(chaveSave(email));
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || d.v !== 1) return null;
    const s = Object.assign(novoJogo(), d);
    s.fazendo = null; s.vel = 0;
    return s;
  }catch(e){ return null; }
}

function marcarSave(txt){
  const t = document.getElementById('saveTag');
  if(t) t.textContent = txt;
}

async function mandarPraNuvem(){
  if(!online || !sessao || !sessao.token || mandando || !S) return;
  mandando = true;
  const r = await api('/save', comToken({method:'PUT', body: JSON.stringify({estado: JSON.stringify(S), quando: Date.now()})}));
  mandando = false;
  if(r.ok) marcarSave('salvo na sua conta · ' + new Date().toLocaleTimeString('pt-BR'));
  else if(r.status === 0) marcarSave('sem conexão — salvo neste aparelho');
}

function salvar(agoraJa){
  if(!perfilAtual || !S) return;
  const grava = () => {
    try{
      localStorage.setItem(chaveSave(perfilAtual), JSON.stringify(S));
      marcarSave(online ? 'salvo neste aparelho, enviando...' : 'salvo neste aparelho · ' + new Date().toLocaleTimeString('pt-BR'));
    }catch(e){}
  };
  if(agoraJa){ grava(); mandarPraNuvem(); return; }
  clearTimeout(salvarTimer);
  salvarTimer = setTimeout(grava, 1500);
  clearTimeout(mandarTimer);
  mandarTimer = setTimeout(mandarPraNuvem, 12000);
}

/* ---------- início ---------- */
function comecar(){
  S = novoJogo();
  S.vel = 0;                       // o relogio so anda depois que alguem entra
  S.ultimoMes = agora().getMonth();
  document.getElementById('doStop').onclick = pararAcao;
  ligarSom(); ajustarFx();
  window.addEventListener('resize', () => { ajustarCanvas(); ajustarFx(); });
  window.addEventListener('beforeunload', () => salvar(true));
  requestAnimationFrame(loop);

  const bruto = (location.hash||'').replace('#','') || (new URLSearchParams(location.search).get('v')||'');
  const atalho = bruto.split(/[,\-/]/).filter(Boolean);
  if(atalho.includes('demo')){
    popularDemo();
    perfilAtual = 'Demo';
    document.getElementById('login').classList.add('off');
    montarAbas(); montarVel(); setVel(0);
    const aba = ABAS.find(a => atalho.includes(a.id));
    irPara(aba ? aba.id : 'casa');
    ajustarCanvas();
    if(atalho.includes('mesa')) abrirMesa();
    const vital = atalho.find(x => AJUDA[x]);
    if(vital) abrirVital(vital);
    if(atalho.includes('voce')) abrirVoce();
    // ?v=demo,agindo,insta  mostra a animação de uma ação parada no tempo
    const agindo = atalho.find(x => ICONE_ACAO[x]);
    if(agindo){
      S.fazendo = {tipo:agindo, label:'Demonstração: '+agindo, sub:'tempo parado', ini:S.t, fim:S.t+99, dados:{comida:CFG.comidas[0]}, sozinho:agindo==='insta'};
      render();
    }
    if(atalho.includes('festa')) setInterval(() => { festa(60); brilho(); }, 800);
    if(atalho.includes('susto')) setInterval(() => susto(true), 900);
    return;
  }

  montarAbas(); montarVel();
  telaLogin();
  setInterval(() => salvar(), 30000);

  // se a sessao anterior ainda vale, entra direto
  (async () => {
    await testarServidor();
    const s = lerSessao();
    if(online && s && s.token){
      sessao = s; perfilAtual = s.email;
      const r = await api('/save', comToken({method:'GET'}));
      if(r.status === 401){ sessao = null; gravarSessao({email: s.email}); perfilAtual = null; telaLogin(); return; }
      if(r.ok){ await abrirPartida(); return; }
    }
    telaLogin();
  })();
}
