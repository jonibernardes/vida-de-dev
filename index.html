<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1E2740">
<meta name="description" content="Voce faz sistemas sob medida em casa e tenta pagar R$ 9 mil de contas todo mes sem se destruir.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vida de Dev">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<title>Vida de Dev</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>html,body{height:100%;overflow:hidden;background:#0C1120}body{margin:0}</style>
</head>
<body>
<style>
:root{
  --noite:#151C2E; --noite2:#1E2740; --carta:#232E4A; --carta2:#2B3757;
  --linha:#3A4770; --texto:#EEF1F8; --texto2:#A3ADC8; --texto3:#6E7899;
  --parede:#F2E2C9; --parede2:#E2CDAE; --piso:#C4854F; --piso2:#A96C3C;
  --madeira:#8C5A33; --azulejo:#CFE3E6;
  --laranja:#F2A03D; --verde:#4CAF7D; --vermelho:#E0503A; --roxo:#8E6BD9;
  --azul:#4C8FD6; --rosa:#E07A9B;
  --r:14px; --r2:10px;
  color-scheme:dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; background:#0C1120; color:var(--texto);
  font-family:'Figtree',system-ui,-apple-system,sans-serif;
  display:flex; justify-content:center; align-items:stretch;
  min-height:100dvh; overscroll-behavior:none;
}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif; margin:0; text-wrap:balance}
.mono{font-family:'DM Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}

#app{
  width:100%; max-width:430px; min-height:100dvh; height:100dvh;
  background:var(--noite); display:flex; flex-direction:column;
  position:relative; overflow:hidden;
  box-shadow:0 0 80px rgba(0,0,0,.6);
}

/* ---------- HUD ---------- */
#hud{
  flex:0 0 auto; padding:8px 10px 7px; background:var(--noite2);
  border-bottom:1px solid var(--linha); display:flex; flex-direction:column; gap:6px;
}
.hudTop{display:flex; align-items:center; gap:8px}
.clock{
  display:flex; align-items:baseline; gap:6px; flex:1; min-width:0;
}
.clock .hora{font-family:'Bricolage Grotesque'; font-weight:800; font-size:21px; letter-spacing:-.5px}
.clock .data{font-size:11px; color:var(--texto2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.spd{display:flex; gap:3px; align-items:center; background:var(--carta); border-radius:9px; padding:3px}
.spd button{
  font-size:10px; font-weight:700; padding:3px 5px; border-radius:6px; color:var(--texto3);
  font-family:'DM Mono',monospace; min-width:26px;
}
.spd button.on{background:var(--laranja); color:#231603}
#btSom{font-size:15px; padding:3px 4px; border-radius:8px; background:var(--carta); line-height:1}
#btSom.mudo{opacity:.35}

/* ---------- efeitos ---------- */
#fx{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:70}
#flash{
  position:absolute; inset:0; pointer-events:none; z-index:68; opacity:0;
  background:radial-gradient(ellipse at center, rgba(224,80,58,0) 30%, rgba(224,80,58,.55) 100%);
}
#flash.bate{animation:bate .5s ease-out}
#flash.bom{background:radial-gradient(ellipse at center, rgba(76,175,125,0) 35%, rgba(76,175,125,.4) 100%)}
@keyframes bate{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
#app.treme{animation:treme .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes treme{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}
@media (prefers-reduced-motion:reduce){
  #app.treme{animation:none} #flash.bate{animation:pisca .5s}
  @keyframes pisca{0%,100%{opacity:0}30%{opacity:.7}}
}
.hudBot{display:flex; gap:6px}
.chip{
  flex:1; background:var(--carta); border-radius:var(--r2); padding:4px 7px;
  display:flex; flex-direction:column; gap:1px; min-width:0;
}
.chip .k{font-size:9px; text-transform:uppercase; letter-spacing:.7px; color:var(--texto3); font-weight:700}
.chip .v{font-size:14px; font-weight:700; font-family:'DM Mono',monospace; white-space:nowrap}
.chip.neg .v{color:var(--vermelho)}
.chip.pos .v{color:var(--verde)}
.miniBar{height:4px; border-radius:3px; background:var(--linha); overflow:hidden; margin-top:3px}
.miniBar i{display:block; height:100%; border-radius:3px; background:var(--roxo)}

/* vitais: coluna em pé, no alto à esquerda, sempre visível */
#vitais{
  position:absolute; left:6px; top:6px; z-index:20;
  display:flex; flex-direction:column; gap:4px; width:62px;
}
#vitais button{
  background:rgba(35,46,74,.90); border-radius:9px; padding:4px 5px;
  display:grid; grid-template-columns:15px 1fr; grid-template-rows:auto 4px;
  gap:0 5px; align-items:center; backdrop-filter:blur(3px);
  box-shadow:0 2px 8px rgba(6,10,20,.4);
}
#vitais button:active{transform:scale(.94)}
#vitais button i{font-style:normal; font-size:12px; grid-row:1; grid-column:1}
#vitais button u{
  grid-row:1; grid-column:2; text-align:right;
  text-decoration:none; font-family:'DM Mono',monospace; font-size:13px; font-weight:500;
  font-variant-numeric:tabular-nums; line-height:1.1;
}
#vitais button s{
  grid-row:2; grid-column:1 / -1; text-decoration:none;
  height:4px; border-radius:3px; background:rgba(255,255,255,.13); overflow:hidden; display:block;
  position:relative; margin-top:2px;
}
#vitais button s b{display:block; height:100%; border-radius:3px}
#vitais button s em{
  position:absolute; top:-1px; width:2px; height:6px; background:rgba(255,255,255,.75); border-radius:1px;
}

/* ações grandes, em pé, no canto inferior direito */
#acoes{
  position:absolute; right:7px; bottom:8px; z-index:20;
  display:flex; flex-direction:column-reverse; gap:5px; align-items:flex-end;
  max-height:calc(100% - 14px); overflow-y:auto; padding:2px;
  scrollbar-width:none;
}
#acoes::-webkit-scrollbar{display:none}
#acoes button{
  width:56px; height:52px; border-radius:15px;
  background:rgba(35,46,74,.93); box-shadow:0 3px 10px rgba(6,10,20,.5);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  backdrop-filter:blur(3px); border:1px solid rgba(255,255,255,.06);
}
#acoes button:active{transform:scale(.92)}
#acoes button .ai{font-size:21px; line-height:1}
#acoes button .an{font-size:8.5px; font-weight:700; letter-spacing:.2px; color:var(--texto2)}
#acoes button.destaque{background:var(--laranja); border-color:transparent}
#acoes button.destaque .an{color:#231603}
#acoes button.travado{opacity:.4}
#acoes button .selo{
  position:absolute; margin:-40px 0 0 34px; background:var(--vermelho); color:#fff;
  font-size:9px; font-weight:800; min-width:16px; height:16px; border-radius:8px;
  display:flex; align-items:center; justify-content:center; padding:0 3px;
}
.view.on#v-casa{padding-left:0}
#v-zap .pad, #v-grana .pad, #v-fama .pad{padding-left:74px}
/* painel de cada barra */
.vTopo{display:flex; align-items:center; gap:11px; margin-bottom:12px}
.vTopo .ico{font-size:27px; line-height:1}
.vTopo .num{font-family:'Bricolage Grotesque'; font-size:31px; font-weight:800; letter-spacing:-1px; line-height:1}
.vTopo .lado{flex:1}
.vTopo .rot{font-size:11px; text-transform:uppercase; letter-spacing:.9px; color:var(--texto3); font-weight:700}
.linhas{display:flex; flex-direction:column; gap:1px}
.linha{display:flex; gap:9px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--linha)}
.linha:last-child{border-bottom:0}
.linha .o{flex:1; font-size:12.5px; line-height:1.4}
.linha .q{
  font-family:'DM Mono',monospace; font-size:11.5px; font-weight:500; white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.q.up{color:var(--verde)} .q.dn{color:var(--vermelho)}
.alerta{
  background:rgba(224,80,58,.13); border-left:3px solid var(--vermelho); border-radius:9px;
  padding:9px 11px; font-size:12px; line-height:1.5; margin-top:4px;
}
.calmo{
  background:rgba(76,175,125,.11); border-left:3px solid var(--verde); border-radius:9px;
  padding:9px 11px; font-size:12px; line-height:1.5; margin-top:4px;
}

/* ---------- views ---------- */
#views{flex:1 1 auto; position:relative; overflow:hidden}
.view{position:absolute; inset:0; overflow-y:auto; display:none; -webkit-overflow-scrolling:touch}
.view.on{display:block}
.pad{padding:12px 12px 20px}

/* ---------- casa ---------- */
#houseWrap{position:relative}
#house{display:block; width:100%}
.hint{
  position:absolute; left:0; right:0; bottom:6px; text-align:center;
  font-size:11px; color:var(--texto3); pointer-events:none;
}

/* ---------- abas ---------- */
#tabs{
  flex:0 0 auto; display:flex; background:var(--noite2); border-top:1px solid var(--linha);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabs button{
  flex:1; padding:6px 2px 7px; display:flex; flex-direction:column; align-items:center; gap:2px;
  font-size:9px; font-weight:700; color:var(--texto3); position:relative;
}
#tabs button .ic{font-size:17px; line-height:1}
#tabs button.on{color:var(--laranja)}
#tabs button.on::before{content:''; position:absolute; top:0; left:22%; right:22%; height:2px; background:var(--laranja); border-radius:0 0 3px 3px}
.badge{
  position:absolute; top:3px; right:calc(50% - 20px); background:var(--vermelho); color:#fff;
  font-size:9px; font-weight:800; min-width:15px; height:15px; border-radius:8px;
  display:flex; align-items:center; justify-content:center; padding:0 3px;
}

/* ---------- barra de ação em curso ---------- */
#doing{
  flex:0 0 auto; display:none; padding:7px 12px; background:var(--carta2);
  border-bottom:1px solid var(--linha); align-items:center; gap:9px;
}
#doing.sozinho{background:rgba(142,107,217,.22); box-shadow:inset 3px 0 0 var(--roxo)}
#doing.sozinho .stop{display:none}
#doing.sozinho .prog i{background:var(--roxo)}
#doing.on{display:flex}
#doing .txt{flex:1; min-width:0}
#doing .t1{font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#doing .t2{font-size:10px; color:var(--texto2); font-family:'DM Mono',monospace}
#doing .prog{height:5px; background:var(--linha); border-radius:3px; margin-top:4px; overflow:hidden}
#doing .prog i{display:block; height:100%; background:var(--laranja); border-radius:3px; transition:width .2s}
#doing .stop{font-size:11px; font-weight:700; color:var(--vermelho); padding:5px 8px; border:1px solid var(--vermelho); border-radius:8px}

/* ---------- cartões ---------- */
.card{background:var(--carta); border-radius:var(--r); padding:11px 12px; margin-bottom:9px}
.card.warn{box-shadow:inset 3px 0 0 var(--laranja)}
.card.bad{box-shadow:inset 3px 0 0 var(--vermelho)}
.card.good{box-shadow:inset 3px 0 0 var(--verde)}
.cardTop{display:flex; align-items:flex-start; gap:8px; margin-bottom:5px}
.cardTop h3{font-size:14px; font-weight:700; flex:1; letter-spacing:-.2px}
.pill{
  font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
  padding:3px 7px; border-radius:20px; background:var(--linha); color:var(--texto2); white-space:nowrap;
}
.pill.o{background:rgba(242,160,61,.18); color:var(--laranja)}
.pill.v{background:rgba(76,175,125,.18); color:var(--verde)}
.pill.r{background:rgba(224,80,58,.2); color:var(--vermelho)}
.pill.x{background:rgba(142,107,217,.2); color:var(--roxo)}
.meta{font-size:11.5px; color:var(--texto2); line-height:1.5}
.meta b{color:var(--texto); font-weight:600}
.acts{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap}
.btn{
  padding:7px 11px; border-radius:9px; background:var(--linha); font-size:12px; font-weight:700;
}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--laranja); color:#231603}
.btn.dan{background:rgba(224,80,58,.2); color:var(--vermelho)}
.btn.gho{background:none; border:1px solid var(--linha); color:var(--texto2)}
.btn[disabled]{opacity:.4}
.secTit{
  font-family:'Bricolage Grotesque'; font-size:12px; font-weight:700; text-transform:uppercase;
  letter-spacing:1.1px; color:var(--texto3); margin:16px 0 8px; display:flex; align-items:center; gap:7px;
}
.secTit:first-child{margin-top:2px}
.secTit .n{background:var(--linha); color:var(--texto2); border-radius:20px; padding:1px 7px; font-size:10px; letter-spacing:0}
.vazio{color:var(--texto3); font-size:12px; padding:6px 2px 12px; line-height:1.55}
.prog2{height:6px; background:var(--linha); border-radius:4px; overflow:hidden; margin-top:8px}
.prog2 i{display:block; height:100%; background:var(--verde); border-radius:4px}

/* ---------- barras da pessoa ---------- */
.bars{display:flex; flex-direction:column; gap:9px}
.bar .l{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px}
.bar .l span:last-child{font-family:'DM Mono',monospace; color:var(--texto2); font-size:11px}
.bar .t{height:9px; background:var(--noite2); border-radius:5px; overflow:hidden}
.bar .t i{display:block; height:100%; border-radius:5px; transition:width .35s}

/* ---------- modal ---------- */
#sheet{
  position:absolute; inset:0; background:rgba(6,10,20,.72); display:none;
  align-items:flex-end; z-index:40; backdrop-filter:blur(2px);
}
#sheet.on{display:flex}
#sheetBox{
  width:100%; background:var(--noite2); border-radius:20px 20px 0 0; padding:14px 14px 22px;
  max-height:88%; overflow-y:auto; border-top:1px solid var(--linha);
  animation:up .22s cubic-bezier(.2,.9,.3,1);
}
#sheetBox.meia{max-height:52%; padding:0 0 12px; display:flex; flex-direction:column}
.sheetHead{
  position:sticky; top:0; background:var(--noite2); z-index:2; padding:12px 14px 9px;
  display:flex; align-items:center; gap:9px; border-bottom:1px solid var(--linha);
}
.sheetHead h2{font-size:15px; flex:1}
.sheetHead .fechar{font-size:17px; color:var(--texto3); padding:2px 6px; line-height:1}
.sheetScroll{overflow-y:auto; padding:10px 14px 6px; flex:1}
/* mesa compacta */
.meia .card{padding:8px 10px; margin-bottom:6px; border-radius:11px}
.meia .cardTop{margin-bottom:3px; gap:6px}
.meia .cardTop h3{font-size:12.5px}
.meia .pill{font-size:8.5px; padding:2px 6px}
.meia .meta{font-size:11px; line-height:1.4}
.meia .acts{margin-top:6px; gap:5px}
.meia .btn{padding:5px 9px; font-size:11.5px; border-radius:8px}
.meia .secTit{margin:10px 0 5px; font-size:10.5px}
.meia .secTit:first-child{margin-top:0}
.meia .prog2{height:5px; margin-top:6px}
@keyframes up{from{transform:translateY(30px); opacity:.4}}
@media (prefers-reduced-motion:reduce){#sheetBox{animation:none}}
#sheetBox h2{font-size:17px; margin-bottom:3px}
#sheetBox .sub{font-size:12px; color:var(--texto2); margin-bottom:12px; line-height:1.5}
.opt{
  width:100%; text-align:left; background:var(--carta); border-radius:12px; padding:11px 12px;
  margin-bottom:7px; display:flex; align-items:center; gap:11px;
}
.opt .ic{font-size:20px; width:24px; text-align:center}
.opt .b{flex:1; min-width:0}
.opt .b .n{font-size:14px; font-weight:700}
.opt .b .d{font-size:11px; color:var(--texto2); margin-top:1px; line-height:1.4}
.opt .c{font-size:11px; color:var(--texto3); font-family:'DM Mono',monospace; text-align:right; white-space:nowrap}
.opt[disabled]{opacity:.45}
input[type=number],input[type=text],input[type=password]{
  width:100%; background:var(--carta); border:1px solid var(--linha); color:var(--texto);
  border-radius:10px; padding:11px 12px; font-size:17px; font-family:'DM Mono',monospace; font-weight:500;
  -webkit-appearance:none; appearance:none;
}
input::placeholder{color:var(--texto3); font-family:'Figtree',sans-serif; font-size:14px}
input:focus-visible{outline:2px solid var(--laranja); outline-offset:1px; border-color:transparent}
input[type=range]{width:100%; accent-color:var(--laranja)}
label.f{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--texto3); font-weight:700; margin:12px 0 5px}

/* ---------- toast ---------- */
#toasts{
  position:absolute; left:8px; right:8px; bottom:8px; top:auto; z-index:55;
  display:flex; flex-direction:column-reverse; gap:6px; pointer-events:none;
}
.toast{
  background:var(--carta2); border:1px solid var(--linha); border-radius:12px; padding:9px 12px;
  font-size:12.5px; line-height:1.45; box-shadow:0 10px 28px rgba(0,0,0,.55);
  animation:tin .25s; border-left:3px solid var(--laranja);
}
.toast.v{border-left-color:var(--verde)} .toast.r{border-left-color:var(--vermelho)}
.toast.x{border-left-color:var(--roxo)} .toast b{font-weight:700}
@keyframes tin{from{transform:translateY(10px); opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

.stars{color:var(--laranja); letter-spacing:2px; font-size:15px}
.kv{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--linha)}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-family:'DM Mono',monospace; font-weight:500}
.big{font-family:'Bricolage Grotesque'; font-size:27px; font-weight:800; letter-spacing:-1px; font-variant-numeric:tabular-nums}
.saveTag{font-size:9.5px; color:var(--texto3); text-align:center; padding:10px 0 4px; letter-spacing:.4px}

/* ---------- entrada ---------- */
#login{
  position:absolute; inset:0; z-index:80; background:var(--noite);
  display:flex; align-items:center; justify-content:center; padding:22px;
}
#login.off{display:none}
.loginBox{width:100%; max-width:330px}
.loginBox h1{font-size:31px; letter-spacing:-1.2px; margin-bottom:6px}
.lsub{font-size:12.5px; color:var(--texto2); line-height:1.55; margin:0 0 20px}
.lerro{color:var(--vermelho); font-size:12px; margin-top:10px; min-height:16px}
.perfil{
  width:100%; text-align:left; background:var(--carta); border-radius:11px; padding:10px 12px;
  margin-bottom:6px; display:flex; align-items:center; gap:10px;
}
.perfil.sel{background:var(--carta2); box-shadow:inset 3px 0 0 var(--laranja)}
.perfil .av{
  width:30px; height:30px; border-radius:50%; background:var(--laranja); color:#231603;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;
}
.perfil .nm{flex:1; font-size:13.5px; font-weight:600}
.perfil .dt{font-size:10.5px; color:var(--texto3); font-family:'DM Mono',monospace}
.linkBt{
  display:block; width:100%; text-align:center; font-size:12px; color:var(--texto2);
  padding:11px 0 2px; text-decoration:underline; text-underline-offset:3px;
}
.avisoOff{
  background:rgba(224,80,58,.14); border-left:3px solid var(--vermelho); border-radius:10px;
  padding:9px 11px; font-size:11.5px; line-height:1.5; color:var(--texto2); margin-bottom:14px;
}
input[type=email]{
  width:100%; background:var(--carta); border:1px solid var(--linha); color:var(--texto);
  border-radius:10px; padding:11px 12px; font-size:16px; font-family:'DM Mono',monospace; font-weight:500;
  -webkit-appearance:none; appearance:none;
}
</style>

<div id="app">
  <header id="hud">
    <div class="hudTop">
      <div class="clock">
        <div class="hora mono" id="hHora">07:00</div>
        <div class="data" id="hData">seg, 2 de março</div>
      </div>
      <div class="spd" id="spd"></div>

<script>

/* ============================================================

const CFG = {

    {id:'burger', ic:'🍔', n:'Hambúrguer no app', d:'Chega em 30 minutos', h:.5,

const fmt = n => 'R$ ' + Math.round(n).toLocaleString('pt-BR');
const cl  = (v,a,b) => Math.max(a, Math.min(b, v));
const rnd = (a,b) => a + Math.random()*(b-a);
const ri  = (a,b) => Math.floor(rnd(a, b+1));
const pick= a => a[Math.floor(Math.random()*a.length)];
// segunda, 9 de marco: o dia seguinte ao vencimento das contas.
// comecar no dia 2 dava 3 dias ate o dia 5 e a divida era inevitavel.
const D0  = new Date(2026, 2, 9, 7, 0, 0);

const NOMES = ['Wellington','Cleide','Marcos Aurélio','Tatiane','Reginaldo','Sueli','Fabrício',
  'Juliana','Anderson','Rosângela','Everton','Patrícia','Gilmar','Vanessa','Cláudio','Simone',
  'Denilson','Márcia','Rodrigo','Elaine','Josimar','Kelly','Nilton','Bruna','Valdir','Aline'];
const EMPRESAS = ['Auto Peças Bandeirante','Ótica Vista Nova','Clínica Bem Viver','Padaria Pão de Ouro',
  'Transportes Lopes','Doces da Vó Ita','Academia Corpo & Ação','Pet Shop Focinho Feliz',
  'Materiais Ferreira','Salão Vitrine','Borracharia do Zé','Escola Novo Saber','Marmitaria Sabor Caseiro',
  'Distribuidora Central','Imobiliária Terra Firme','Serralheria Aço Forte'];
const PEDIDOS = ['controle de estoque','sistema de ordem de serviço','painel de vendas',
  'agenda de clientes','controle de comissão','sistema de orçamento','ficha de cliente',
  'controle financeiro','painel do vendedor','gestão de entregas','controle de contratos'];

/* ---------------- estado ---------------- */
let S = null;

function novoJogo(){
  return {
    v: 1,
    t: 0,                      // horas de jogo desde o início
    vel: 3,
    dinheiro: 12000,
    divida: 0,
    b:    {energia:78, fome:70, higiene:80, animo:72, corpo:55, estresse:18, casamento:74},
    base: {energia:72, fome:50, higiene:50, animo:68, corpo:58, estresse:22, casamento:70},
    insta: {hoje:0, total:0},
    horasTrabalhoHoje: 0,
    correuHa: 0,
    vontade: null,
    hab: {vendas:22, execucao:30, suporte:15},
    despensa: 70,
    sujeira: 20,
    fazendo: null,             // {tipo,label,sub,fim,ini,dados}
    agenda: true,
    leadsDia: 2,
    mercadoMes: 'normal',
    mercadoMesRef: -1,
    custoLead: 70,
    leads: [],
    projetos: [],
    entregues: [],
    chamados: [],
    zap: [],
    google: {soma:15, n:3},
    ra: {abertas:[], historico:0},
    extrato: [],
    animoBaixoH: 0,
    depre: false,
    ultimoDia: -1,
    ultimoMes: -1,
    faturadoMes: 0,
    gastoLeadsMes: 0,
    rendMes: 0,
    rendTotal: 0,
    seq: 1,
    nome: 'Você',
  };
}

/* ---------------- tempo ---------------- */
const agora = () => new Date(D0.getTime() + S.t*3600e3);
const hDia  = () => { const d = agora(); return d.getHours() + d.getMinutes()/60; };
// hora do dia de um instante ABSOLUTO do jogo (h desde o inicio).
// nao use "h % 24": o jogo comeca as 07:00 e a conta sai 7 horas errada.
const hDe = h => { const d = new Date(D0.getTime() + h*3600e3); return d.getHours() + d.getMinutes()/60; };
const fds   = () => { const w = agora().getDay(); return w===0 || w===6; };
const DIAS  = ['dom','seg','ter','qua','qui','sex','sáb'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function hhmm(h){ const H = Math.floor(h)%24, M = Math.floor((h%1)*60); return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0'); }
function dur(h){
  if(h < 1) return Math.round(h*60)+' min';
  const H = Math.floor(h), M = Math.round((h%1)*60);
  return M ? H+'h'+String(M).padStart(2,'0') : H+'h';
}

/* ---------------- derivados ---------------- */
const estrelas = () => S.google.n ? S.google.soma/S.google.n : 5;
function repIndice(){
  const e = estrelas();
  let v = (e-3)/2;                             // -1 .. 1
  v -= S.ra.historico*0.055 + S.ra.abertas.length*0.09;
  return cl(v, -1, 1);
}
function eficiencia(){
  let f = 1 + 0.78*S.hab.execucao/100;
  if(S.b.energia < 30) f *= 0.6;
  if(S.b.animo < 30) f *= 0.75;
  if(S.b.fome < 20) f *= 0.8;
  if(S.b.estresse > 85) f *= 0.85;
  if(S.depre) f *= 0.4;
  return f;
}
function nomeFaixa(d){
  for(const f of CFG.divida) if(d <= f.ate) return f;
  return CFG.divida[2];
}
function jurosMes(){
  let d = S.divida, juros = 0, base = 0;
  for(const f of CFG.divida){
    const parte = Math.min(d, f.ate) - base;
    if(parte <= 0) break;
    let taxa = f.juros;
    if(f.nome === 'Agiota'){
      const excedente = S.divida - 20000;
      taxa = cl(0.10 + Math.floor(excedente/5000)*0.02, 0.10, 0.30);
    }
    juros += parte*taxa;
    base = f.ate;
    if(S.divida <= f.ate) break;
  }
  return juros;
}
function taxaAgiota(){
  return cl(0.10 + Math.floor(Math.max(0,S.divida-20000)/5000)*0.02, .10, .30);
}

/* ---------------- ações ---------------- */
function ocupado(){ return !!S.fazendo; }
const involuntario = () => !!(S.fazendo && S.fazendo.sozinho);

function iniciar(tipo, label, sub, horas, dados){
  if(involuntario()) return toast('Agora não dá. Espera isso passar.','x');
  if(ocupado()) return toast('Você já está no meio de outra coisa.','r');
  S.fazendo = {tipo, label, sub, ini:S.t, fim:S.t+horas, dados: dados||{}};
  som('toc');
  if(S.vel === 0) setVel(3);
  render();
}
function pararAcao(){
  if(!S.fazendo) return;
  // o que o corpo e a cabeça começaram sozinhos, você não desliga no botão
  if(S.fazendo.sozinho) return toast('Isso não para porque você quer. Vai passar sozinho.','x');
  const f = S.fazendo;
  S.fazendo = null;
  if(f.tipo === 'dormir') toast('Você levantou antes da hora.','x');
  render();
}
function concluir(f){
  const d = f.dados;
  switch(f.tipo){
    case 'dormir': break;
    case 'comer': {
      const c = d.comida || CFG.comidas[0];
      S.b.fome = cl(S.b.fome + c.fome, 0, 100);
      S.b.corpo = cl(S.b.corpo + c.corpo, 0, 100);
      S.base.corpo = cl(S.base.corpo + c.base, 0, 100);
      S.b.animo = cl(S.b.animo + c.animo, 0, 100);
      if(c.desp) S.despensa = cl(S.despensa - c.desp, 0, 100);
      if(c.custo){ S.dinheiro -= c.custo; ex(c.n, -c.custo); }
      break;
    }
    case 'insta': break;
    case 'banho': S.b.higiene = cl(S.b.higiene+70,0,100); S.b.animo += 3; break;
    case 'correr':
      S.b.corpo = cl(S.b.corpo+7,0,100); S.base.corpo = cl(S.base.corpo+1.6,0,100);
      S.b.higiene = cl(S.b.higiene-25,0,100);
      S.b.estresse = cl(S.b.estresse-8,0,100); S.base.estresse = cl(S.base.estresse-0.8,0,100);
      S.b.animo = cl(S.b.animo+5,0,100);
      S.correuHa = 0;
      toast('Corrida feita. A cabeça limpa junto.','v'); break;
    case 'mercado':
      S.despensa = 100; S.dinheiro -= CFG.mercado.custo; ex('Mercado', -CFG.mercado.custo);
      toast('Despensa cheia.','v'); break;
    case 'limpar': S.sujeira = 0; S.b.animo = cl(S.b.animo+4,0,100); break;
    case 'tv': S.b.animo = cl(S.b.animo+9,0,100); S.b.estresse = cl(S.b.estresse-4,0,100); break;
    case 'tania':
      S.b.casamento = cl(S.b.casamento + (d.grande?12:6), 0, 100);
      S.base.casamento = cl(S.base.casamento + (d.grande?2:1), 0, 100);
      S.b.estresse = cl(S.b.estresse-10,0,100);
      S.b.animo = cl(S.b.animo+6,0,100);
      toast('Tempo com a Tania. Ela reparou.','v'); break;
    case 'limpezaTania':
      S.b.casamento = cl(S.b.casamento+10,0,100); S.base.casamento = cl(S.base.casamento+3,0,100);
      S.b.energia = cl(S.b.energia-30,0,100);
      toast('4 horas de limpeza. O corpo sentiu.','x'); break;
    case 'curso':
      S.hab.execucao = cl(S.hab.execucao+CFG.curso.ganho,0,100);
      toast('Curso terminado. Execução +'+CFG.curso.ganho+'.','v'); break;
    case 'reuniao': fimReuniao(d.id); break;
    case 'follow': fimFollow(d.id); break;
    case 'chamado': fimChamado(d.id); break;
    case 'avaliacao': fimAvaliacao(d.id); break;
    case 'responderRA': fimResponderRA(d.id); break;
    case 'projeto': break;
  }
  S.fazendo = null;
}

/* ---------------- loop ---------------- */
let ultimo = performance.now();
function loop(now){
  const real = Math.min(now - ultimo, 500);
  ultimo = now;
  const vel = CFG.vels[S.vel];
  if(vel > 0){
    let dt = (real/CFG.msPorHora)*vel;
    // avança em fatias pra não pular evento de hora
    while(dt > 0){
      const passo = Math.min(dt, 0.25);
      avancar(passo);
      dt -= passo;
    }
  }
  desenharCasa();
  if(now - ultimoHud > 220){ ultimoHud = now; atualizarHud(); }
  requestAnimationFrame(loop);
}
let ultimoHud = 0;

function avancar(dt){
  const antes = agora();
  S.t += dt;
  const dep = agora();

  // --- barras
  const b = S.b;
  b.fome    = cl(b.fome + CFG.decai.fome*dt, 0, 100);
  b.higiene = cl(b.higiene + CFG.decai.higiene*dt, 0, 100);

  const dormindo = S.fazendo && S.fazendo.tipo === 'dormir';
  if(dormindo){
    b.energia = cl(b.energia + CFG.dormeEnergia*dt, 0, 100);
    b.estresse = cl(b.estresse - 0.6*dt, 0, 100);
  } else {
    let de = CFG.decai.energia;
    if(b.corpo < 40) de *= 1.25;
    b.energia = cl(b.energia + de*dt, 0, 100);
  }

  let da = CFG.decai.animo;
  if(S.sujeira > 60) da -= 0.7;
  if(b.higiene < 25) da -= 0.5;
  if(b.casamento < 30) da -= 0.8;
  if(b.estresse > 80) da -= 0.9;
  // fila cheia pesa: cada projeto além do terceiro, e cada atraso, derruba o ânimo
  const abertos = S.projetos.length;
  const atrasados = S.projetos.filter(p => S.t > p.prazo).length;
  if(abertos > 3) da -= 0.3*(abertos - 3);
  da -= 0.6*atrasados;
  if(S.chamados.length > 1) da -= 0.25*(S.chamados.length - 1);
  if(!dormindo && S.fazendo && S.fazendo.tipo === 'tv') da = 0;
  b.animo = cl(b.animo + da*dt, 0, 100);

  S.sujeira = cl(S.sujeira + 1.4*dt, 0, 100);

  // instagram: sobe o ânimo na hora e cobra depois
  if(S.fazendo && S.fazendo.tipo === 'insta'){
    S.insta.hoje += dt; S.insta.total += dt;
    b.animo = cl(b.animo + CFG.insta.animoCurto*dt, 0, 100);
    if(S.insta.hoje > CFG.insta.limiteDia){
      b.estresse = cl(b.estresse + CFG.insta.estresse*dt, 0, 100);
      S.base.animo = cl(S.base.animo - CFG.insta.custoBasal*dt, 0, 100);
    }
  }
  if(S.fazendo && S.fazendo.tipo === 'projeto') S.horasTrabalhoHoje += dt;

  // o atual persegue o basal: quem tem base boa se recupera sozinho
  CFG.comBasal.forEach(k => {
    b[k] = cl(b[k] + (S.base[k] - b[k]) * CFG.puxaBasal * dt, 0, 100);
  });

  // estresse contínuo por dívida
  b.estresse = cl(b.estresse + (S.divida/5000)*(dt/24), 0, 100);

  // depressão
  if(b.animo < 10) S.animoBaixoH += dt; else S.animoBaixoH = Math.max(0, S.animoBaixoH - dt*2);
  if(!S.depre && S.animoBaixoH >= 48){
    S.depre = true;
    toast('<b>Você travou.</b> Semanas ignorando tudo cobraram o preço. Descanso é o único caminho, e ele é lento.','r', 9000, 'travou');
  }
  if(S.depre){
    if(descansando()) b.animo = cl(b.animo + 3*(dt/24), 0, 100);
    if(b.animo > 35){ S.depre = false; toast('A cabeça voltou ao lugar. Vá devagar.','v'); }
  }

  // --- ação em curso
  if(S.fazendo){
    const f = S.fazendo;
    if(f.tipo === 'projeto'){
      const p = S.projetos.find(x => x.id === f.dados.id);
      if(!p){ S.fazendo = null; }
      else {
        p.feitas += dt*eficiencia();
        S.hab.execucao = cl(S.hab.execucao + 0.5*dt, 0, 100);
        if(p.feitas >= p.horas){ p.feitas = p.horas; S.fazendo = null; toast('<b>'+p.cliente+'</b> — o sistema está pronto. Falta entregar.','v'); }
        else if(S.t >= f.fim) S.fazendo = null;
      }
    } else if(f.tipo === 'chamado'){
      const c = S.chamados.find(x => x.id === f.dados.id);
      if(!c) S.fazendo = null;
      else { c.feitas += dt*(1 + 0.5*S.hab.suporte/100); if(c.feitas >= c.horas) concluir(f); }
    } else if(S.t >= f.fim){
      concluir(f);
    }
  }

  // --- viradas
  if(dep.getHours() !== antes.getHours()) porHora(dep);
  if(dep.getDate() !== antes.getDate()) porDia(dep);
}

function descansando(){
  return !S.fazendo || ['dormir','tv','tania','correr','comer','banho'].includes(S.fazendo.tipo);
}

/* ---------------- por hora ---------------- */
function porHora(d){
  const h = d.getHours();
  // leads pingam entre 9 e 18, dia útil
  if(S.agenda && !fds() && h >= 9 && h <= 18) tentarLead();
  // reunião marcada perdeu a hora?
  S.leads.forEach(l => {
    if(l.st === 'marcada' && S.t > l.hReuniao + 1 && !l.atrasada){
      l.atrasada = true;
      toast('Passou da hora da reunião com <b>'+l.nome+'</b>. Ainda dá pra correr atrás hoje.','x');
    }
  });
  if(h >= 8 && h <= 20 && (!fds() || Math.random() < 0.3)) chegarChamado();
  autocuidado();
  vontadePropria();
  render(true);
}

// abaixo de certo ponto o corpo resolve sozinho, com ou sem a sua vontade
function autocuidado(){
  if(involuntario()) return;
  const b = S.b;
  const ate = (hDia() < 7 ? 7-hDia() : 31-hDia());
  const rapida = CFG.comidas.find(c => c.id === (S.despensa >= 6 ? 'ovo' : 'doce'));
  let a = null;

  if(b.energia < 8)
    a = {tipo:'dormir', label:'Apagou de cansaço', sub:'o corpo desligou', h:Math.min(ate, 9),
         txt:'<b>Você apagou.</b> Não teve escolha, o corpo desligou.'};
  else if(b.fome < 10)
    a = {tipo:'comer', label:'Comeu qualquer coisa', sub:'a fome mandou', h:rapida.h, dados:{comida:rapida},
         txt:'<b>A fome venceu.</b> Você foi na cozinha sem pensar e comeu o que tinha na mão.'};
  else if(b.higiene < 10)
    a = {tipo:'banho', label:'Foi tomar banho', sub:'não dava mais', h:.35,
         txt:'<b>Não dava mais.</b> Você largou tudo e foi pro chuveiro.'};
  else if(S.sujeira > 92)
    a = {tipo:'limpar', label:'Começou a limpar', sub:'a bagunça incomodou', h:1,
         txt:'<b>A bagunça passou do ponto.</b> Você começou a limpar sem decidir isso.'};

  if(!a) return;
  S.fazendo = {tipo:a.tipo, label:a.label, sub:a.sub, ini:S.t, fim:S.t+a.h, dados:a.dados||{}, sozinho:true};
  toast(a.txt, 'x', 7500);
  render();
}

// o personagem tem vontade própria: cabeça cansada foge do trabalho sozinha
function vontadePropria(){
  const f = S.fazendo;
  if(!f || !['projeto','chamado'].includes(f.tipo)) return;
  const b = S.b;
  let ch = 0.05;
  if(b.animo < 45) ch += (45 - b.animo) * 0.005;
  if(b.estresse > 55) ch += (b.estresse - 55) * 0.004;
  if(b.energia < 45) ch += (45 - b.energia) * 0.004;
  if(S.horasTrabalhoHoje > 5) ch += (S.horasTrabalhoHoje - 5) * 0.03;
  if(S.depre) ch += 0.25;
  ch = Math.min(ch, 0.55);
  if(Math.random() > ch) return;

  const r = Math.random();
  if(r < 0.62){
    const min = ri(20, 50);
    S.fazendo = {tipo:'insta', label:'Rolando o Instagram', sub:min+' minutos que você não escolheu', ini:S.t, fim:S.t + min/60, dados:{}, sozinho:true};
    toast(pick([
      '<b>Você abriu o Instagram sem pensar.</b> O código ficou pra trás.',
      '<b>Pegou o celular "só um minuto".</b> Já faz um tempo.',
      '<b>Travou no feed.</b> Nem lembra por que abriu.',
    ]), 'x', 6500);
  } else if(r < 0.85){
    S.fazendo = {tipo:'comer', label:'Foi na cozinha beliscar', sub:'não era fome', ini:S.t, fim:S.t + .25, dados:{comida:CFG.comidas.find(c=>c.id==='doce')}, sozinho:true};
    toast('<b>Levantou pra beliscar.</b> Não era fome, era cansaço.', 'x', 6000);
  } else {
    const min = ri(10, 25);
    S.fazendo = {tipo:'parado', label:'Parou de trabalhar', sub:'olhando pra parede', ini:S.t, fim:S.t + min/60, dados:{}, sozinho:true};
    S.b.animo = cl(S.b.animo - 3, 0, 100);
    toast('<b>Você travou olhando pra parede.</b> '+min+' minutos que não voltam.', 'x', 6000);
  }
  render();
}

function tentarLead(){
  const m = CFG.mercados[S.mercadoMes];
  const porHoraAlvo = S.leadsDia/9;
  const vol = rnd(m.volMin, m.volMax);
  if(Math.random() > porHoraAlvo*vol) return;
  if(S.leads.filter(l => l.st !== 'perdido').length >= 12) return;
  criarLead();
}

function criarLead(){
  const m = CFG.mercados[S.mercadoMes];
  const r = Math.random();
  const classe = r < m.mixA ? 'A' : (r < m.mixA+m.mixB ? 'B' : 'C');
  const tr = Math.random()*100;
  const tipo = tr < 45 ? 'S' : (tr < 90 ? 'M' : 'C');
  const T = CFG.tipos[tipo];
  const base = rnd(T.pMin, T.pMax);
  const custo = rnd(m.custoMin, m.custoMax);

  S.dinheiro -= custo; S.gastoLeadsMes += custo; ex('Lead', -custo);

  const rep = repIndice();
  const teto = base * CFG.classes[classe].teto * (1 + rep*0.16);

  // reunião amanhã (ou segunda) entre 9h e 17h
  let hR = S.t + (24 - hDia()) + rnd(9, 17);
  for(let i=0;i<3;i++){
    const dd = new Date(D0.getTime() + hR*3600e3);
    if(dd.getDay()===0 || dd.getDay()===6) hR += 24; else break;
  }

  const l = {
    id: S.seq++, nome: pick(NOMES), empresa: pick(EMPRESAS), pedido: pick(PEDIDOS),
    classe, tipo, base, teto, custo, st:'marcada', hReuniao:hR, follows:0, atrasada:false,
    orcamento:0, noShow: Math.random() < CFG.noShow,
  };
  S.leads.push(l);
  toast('Lead novo: <b>'+l.empresa+'</b>. Reunião '+diaRel(hR)+' às '+hhmm(hDe(hR))+'.', 'o');
}

function diaRel(h){
  const d1 = agora().getDate(), d2 = new Date(D0.getTime()+h*3600e3);
  if(d2.getDate() === d1) return 'hoje';
  const amanha = new Date(agora().getTime()+864e5);
  if(d2.getDate() === amanha.getDate()) return 'amanhã';
  return DIAS[d2.getDay()];
}

// cada sistema entregue traz de 3 a 10 chamados nos primeiros 30 dias.
// depois disso cai muito, mas cliente chato nunca para de pedir.
const PACIENCIA = {A:72, B:48, C:24};   // horas até ele reclamar
const CHAMADOS_TXT = ['Erro ao salvar um cadastro.','O relatório saiu com número errado.',
  'Não consegue logar.','Pediu um campo novo na tela.','A tela trava no celular.',
  'Quer mudar a ordem das colunas.','O filtro não traz o mês certo.','Sumiu um registro, diz ele.',
  'Quer exportar pro Excel.','A senha do funcionário novo não funciona.'];

function chegarChamado(){
  if(!S.entregues.length) return;
  S.entregues.forEach(cli => {
    if(cli.cota == null){
      cli.cota = ri(3, 10);
      cli.nascido = cli.quando;
      cli.paciencia = PACIENCIA[cli.classe] || 48;
      if(cli.classe === 'C') cli.cota += 4;   // o chato pede mais
    }
    const dias = (S.t - cli.nascido)/24;
    const jaAberto = S.chamados.some(c => c.refId === cli.id);
    if(jaAberto) return;

    let p;
    if(dias <= 30){
      if(cli.cota <= 0) return;
      p = (cli.cota / 30) / 10;                       // espalha a cota pelos 30 dias
    } else {
      // depois do primeiro mês só os teimosos continuam
      p = 0.0025 * CFG.classes[cli.classe].sup;
      if(cli.classe === 'A') p *= 0.4;
    }
    if(Math.random() > p) return;

    const grande = Math.random() < (dias <= 10 ? 0.22 : 0.12);
    S.chamados.push({
      id: S.seq++, cliente: cli.cliente, classe: cli.classe, refId: cli.id,
      horas: grande ? rnd(4,8) : rnd(0.5,2), feitas:0, aberto:S.t, grande, dias:0,
      prazo: cli.paciencia,
      desc: grande ? 'Deu problemão. Parou tudo do lado dele.' : pick(CHAMADOS_TXT),
    });
    if(dias <= 30) cli.cota--;
    const c = S.chamados[S.chamados.length-1];
    toast((grande?'<b>PROBLEMÃO</b> no ':'Chamado de ')+'<b>'+c.cliente+'</b>: '+c.desc+
      ' <span style="color:var(--texto3)">' + Math.round(c.prazo) + 'h pra responder</span>', grande?'r':'x');
  });
}

/* ---------------- por dia ---------------- */
const taxaDia = () => Math.pow(1 + CFG.rendimentoMes, 1/30) - 1;
const rendeHoje = () => S.dinheiro > 0 ? S.dinheiro * taxaDia() : 0;

function porDia(d){
  const dia = d.getDate(), mes = d.getMonth();

  // rendimento do dinheiro parado, creditado todo dia
  const rend = rendeHoje();
  if(rend >= 0.01){
    S.dinheiro += rend;
    S.rendMes = (S.rendMes||0) + rend;
    S.rendTotal = (S.rendTotal||0) + rend;
  }

  // ---- o basal, que é o hábito e não o dia
  S.correuHa = (S.correuHa||0) + 1;
  if(S.correuHa >= 3) S.base.corpo = cl(S.base.corpo - 0.9, 0, 100);      // parou de correr
  if(S.b.energia > 75) S.base.energia = cl(S.base.energia + 0.4, 0, 100); // dormiu bem
  if(S.b.energia < 35) S.base.energia = cl(S.base.energia - 0.5, 0, 100);
  if(S.b.animo > 70) S.base.animo = cl(S.base.animo + 0.3, 0, 100);
  if(S.b.animo < 35) S.base.animo = cl(S.base.animo - 0.5, 0, 100);
  if(S.b.estresse > 70) S.base.estresse = cl(S.base.estresse + 0.7, 0, 100);
  if(S.b.estresse < 30) S.base.estresse = cl(S.base.estresse - 0.6, 0, 100);
  S.base.casamento = cl(S.base.casamento - 0.8, 0, 100);
  if(S.horasTrabalhoHoje > 8){
    S.b.casamento = cl(S.b.casamento - 4, 0, 100);
    S.base.casamento = cl(S.base.casamento - 0.6, 0, 100);
  }
  if(S.insta.hoje > 3) S.base.animo = cl(S.base.animo - 1, 0, 100);
  S.insta.hoje = 0; S.horasTrabalhoHoje = 0;

  // corpo e casamento do dia
  S.b.corpo = cl(S.b.corpo + CFG.corpoParado, 0, 100);
  S.b.casamento = cl(S.b.casamento - 2.2, 0, 100);

  // habilidades caem com desuso
  if(!S.usouVendasHoje) S.hab.vendas = cl(S.hab.vendas - 0.8, 0, 100);
  if(!S.usouExecHoje)   S.hab.execucao = cl(S.hab.execucao - 0.3, 0, 100);
  S.hab.suporte = cl(S.hab.suporte - 0.5, 0, 100);
  S.usouVendasHoje = false; S.usouExecHoje = false;

  // estresse por pendência
  let st = 0;
  S.projetos.forEach(p => { if(S.t > p.prazo){ st += 2; p.atraso = true; } });
  S.chamados.forEach(c => {
    c.dias = (c.dias||0)+1;
    const horas = S.t - c.aberto;
    st += horas > (c.prazo||48) ? 5 : 2;      // passou do prazo, dói mais
  });
  st += S.ra.abertas.length*5;
  S.b.estresse = cl(S.b.estresse + st, 0, 100);

  // clientes irritados reclamam
  S.projetos.forEach(p => { if(p.atraso && Math.random() < .22) reclamar(p.cliente, 'atrasou a entrega'); });
  S.chamados.forEach(c => {
    const horas = S.t - c.aberto, prazo = c.prazo || 48;
    if(horas <= prazo || c.reclamou) return;
    const chance = c.classe === 'C' ? .55 : (c.classe === 'A' ? .18 : .35);
    if(Math.random() < chance){
      c.reclamou = true;
      reclamar(c.cliente, 'passou de '+Math.round(prazo)+' horas sem resposta no suporte');
    }
    // cansou de esperar: pede menos daqui pra frente, e some com a satisfação
    if(horas > prazo*2 && !c.desistiu){
      c.desistiu = true;
      const cli = S.entregues.find(x => x.id === c.refId);
      if(cli){ cli.cota = Math.max(0, (cli.cota||0) - 2); cli.satisfacao = cl(cli.satisfacao - 18, 0, 100); }
      toast('<b>'+c.cliente+'</b> parou de cobrar. Vai pedir menos daqui pra frente, e não é elogio.','x', 7000);
    }
  });

  // leads velhos morrem
  S.leads = S.leads.filter(l => {
    if(l.st === 'perdido') return false;
    if((l.st === 'marcada' || l.st === 'atrasada') && S.t > l.hReuniao + 20){
      toast('<b>'+l.empresa+'</b> desistiu. Você não fez a reunião.','r');
      return false;
    }
    if(l.st === 'pensando' && S.t > l.hOrc + 96){
      toast('<b>'+l.empresa+'</b> sumiu de vez.','r');
      return false;
    }
    return true;
  });

  // mês novo: sorteia mercado
  if(mes !== S.ultimoMes){
    S.ultimoMes = mes;
    const r = Math.random();
    S.mercadoMes = r < .25 ? 'bom' : (r < .75 ? 'normal' : 'ruim');
    const m = CFG.mercados[S.mercadoMes];
    S.custoLead = Math.round(rnd(m.custoMin, m.custoMax));
    if(S.rendMes >= 1){ ex('Rendimento do mês', S.rendMes); toast('O dinheiro parado rendeu <b>'+fmt(S.rendMes)+'</b> no mês.','v'); }
    S.faturadoMes = 0; S.gastoLeadsMes = 0; S.rendMes = 0;
    const txt = {bom:'Mês bom. Lead barato e gente séria aparecendo.',
      normal:'Mês normal. Nada de mais.',
      ruim:'<b>Mês ruim.</b> Lead caro, pouco e de má qualidade. Segura a onda.'};
    toast(txt[S.mercadoMes], S.mercadoMes==='ruim'?'r':'o', 7000);
  }

  // dia 5: contas
  if(dia === CFG.diaContas) cobrarContas();
  // dia 1: juros
  if(dia === 1 && S.divida > 0){
    const j = jurosMes();
    S.divida += j; ex('Juros da dívida', -j, true);
    toast('Juros da dívida: <b>'+fmt(j)+'</b>. Total agora '+fmt(S.divida)+'.','r');
    if(S.divida > 20000 && Math.random() < .5) cobrancaAgiota();
  }

  // evento
  if(Math.random() < 0.24) sortearEvento();

  render(true);
  salvar();
}

function cobrarContas(){
  const total = CFG.contas.reduce((a,c) => a+c.v, 0);
  if(S.dinheiro >= total){
    S.dinheiro -= total; ex('Contas do mês', -total);
    toast('Contas do mês pagas: '+fmt(total)+'.','v', 4200, 'dinheiro');
  } else {
    const falta = total - Math.max(0, S.dinheiro);
    const pago = Math.max(0, S.dinheiro);
    S.dinheiro -= pago;
    S.divida += falta;
    ex('Contas do mês (parcial)', -pago);
    ex('Foi pra dívida', -falta, true);
    S.b.estresse = cl(S.b.estresse+12,0,100);
    toast('<b>Faltou '+fmt(falta)+'</b> pras contas. Foi pra dívida — '+nomeFaixa(S.divida).nome+'.','r', 8000, 'divida');
  }
}

function cobrancaAgiota(){
  S.b.estresse = cl(S.b.estresse+20,0,100);
  S.b.animo = cl(S.b.animo-12,0,100);
  toast('<b>O cara da grana ligou.</b> Não foi uma conversa boa.','r', 8000, 'agiota');

function reclamar(cliente, motivo){
  if(S.ra.abertas.some(r => r.cliente === cliente)) return;
  S.ra.abertas.push({id:S.seq++, cliente, motivo, quando:S.t});

  toast('<b>Reclame Aqui:</b> '+cliente+' reclamou que você '+motivo+'.','r', 7000, 'reclamacao');

/* ---------------- funil ---------------- */
function fazerReuniao(id){
  const l = S.leads.find(x => x.id === id);
  if(!l) return;
  // 30 min: com projeto de R$ 800, uma hora de reunião comia o lucro inteiro
  iniciar('reuniao', 'Reunião com '+l.empresa, l.nome, 0.5, {id});
}
function fimReuniao(id){
  const l = S.leads.find(x => x.id === id);
  if(!l) return;
  S.usouVendasHoje = true;
  S.hab.vendas = cl(S.hab.vendas + 1.5 + (S.seqReuniao||0)*0.4, 0, 100);
  S.seqReuniao = (S.seqReuniao||0)+1;

  if(l.noShow){
    l.st = 'perdido';
    toast('<b>'+l.nome+' não apareceu.</b> O lead você já pagou.','r');
    return;
  }
  let ch = 0.40 + (S.hab.vendas-40)/220 + repIndice()*0.12;
  if(S.b.higiene < 25) ch -= 0.18;
  if(S.b.animo < 30) ch -= 0.15;
  if(S.depre) ch -= 0.4;
  if(!l.atrasada) ch += 0.10;
  ch = cl(ch, .05, .95);

  if(Math.random() < ch){
    l.st = 'orcar';
    toast('<b>'+l.empresa+'</b> gostou. Quer o orçamento.','v');
  } else if(Math.random() < .5){
    l.st = 'perdido';
    toast(l.empresa+' disse que não é o momento.','r');
  } else {
    l.st = 'orcar';
    l.frio = true;
    toast(l.empresa+' ficou morno, mas pediu o orçamento.','x');
  }
}

function abrirOrcamento(id){
  const l = S.leads.find(x => x.id === id);
  if(!l) return;
  const T = CFG.tipos[l.tipo];
  const ref = Math.round(l.base/50)*50;
  sheet(
    `<h2>Orçamento — ${l.empresa}</h2>
     <div class="sub">${l.pedido}, porte <b>${T.nome}</b>. Você não sabe o quanto ele aceita pagar.
     Projeto parecido costuma dar de ${fmt(T.pMin)} a ${fmt(T.pMax)}.</div>
     <label class="f">Seu preço</label>
     <input type="number" id="orcVal" value="${ref}" step="50" min="100">
     <div class="meta" style="margin-top:8px">Metade na assinatura, metade na entrega.</div>`,
    [{ic:'📤', n:'Enviar orçamento', d:'Depois disso é com ele', click:()=>{
        const v = Math.max(100, +document.getElementById('orcVal').value || ref);
        fecharSheet(); enviarOrcamento(l, v);
      }},
     {ic:'↩︎', n:'Agora não', click:fecharSheet}]
  );
}

function chanceFechar(l){
  const r = l.orcamento / l.teto;
  let base = 1/(1 + Math.exp(7.32*(r-1)));
  base *= (0.68 + 0.45*S.hab.vendas/100);
  base += l.follows*CFG.followBonus;
  if(l.frio) base -= 0.15;
  base += repIndice()*0.08;
  return cl(base, .02, .96);
}

function enviarOrcamento(l, v){
  l.orcamento = v; l.hOrc = S.t;
  const ch = chanceFechar(l);
  if(Math.random() < ch) fechar(l);
  else { l.st = 'pensando'; toast('<b>'+l.nome+'</b> ficou de pensar. Vai ter que ir atrás.','x'); }
  render();
}

function fazerFollow(id){
  const l = S.leads.find(x => x.id === id);
  if(!l || l.follows >= CFG.followMax) return;
  iniciar('follow', 'Follow-up com '+l.nome, 'cutucando no zap', CFG.followHoras, {id});
}
function fimFollow(id){
  const l = S.leads.find(x => x.id === id);
  if(!l) return;
  l.follows++;
  S.b.estresse = cl(S.b.estresse+1,0,100);
  S.usouVendasHoje = true;
  const ch = chanceFechar(l) * (l.follows > CFG.followMax ? .4 : 1);
  zap(l.nome, l.follows === 1 ? 'Oi! Conseguiu ver a proposta?' : 'E aí, decidiu?', true);
  if(Math.random() < ch){ fechar(l); }
  else {
    if(l.follows >= CFG.followMax){
      zap(l.nome, 'Vou deixar pra frente, valeu.');
      l.st = 'perdido';
      toast(l.empresa+' passou. Três tentativas e nada.','r');
    } else {
      zap(l.nome, pick(['Tô vendo aqui ainda...','Semana que vem eu te falo','Deixa eu conversar com meu sócio']));
      toast(l.nome+' enrolou de novo.','x');
    }
  }
  render();
}

function fechar(l){
  const T = CFG.tipos[l.tipo];
  const horas = rnd(T.hMin, T.hMax) * (l.orcamento/l.base) * 0.85 + rnd(T.hMin, T.hMax)*0.15;
  const entrada = l.orcamento/2;
  S.dinheiro += entrada; S.faturadoMes += entrada;
  ex('Entrada — '+l.empresa, entrada);
  const p = {
    id: S.seq++, cliente: l.empresa, contato: l.nome, classe: l.classe, tipo: l.tipo,
    preco: l.orcamento, horas: Math.max(3, horas), feitas: 0,
    prazo: S.t + Math.max(72, horas*5.5), inicio: S.t,
    satisfacao: CFG.classes[l.classe].sat, pedido: l.pedido, atraso:false,
  };
  S.projetos.push(p);
  l.st = 'perdido';
  zap(l.nome, 'Fechado! Pode começar.');
  toast('<b>Fechou com '+l.empresa+'</b> por '+fmt(l.orcamento)+'. Entrada de '+fmt(entrada)+' na conta.','v', 7000, 'venda');
}

function trabalhar(id, horas){
  const p = S.projetos.find(x => x.id === id);
  if(!p) return;
  S.usouExecHoje = true;
  iniciar('projeto', 'Codando: '+p.cliente, p.pedido, horas, {id});
}

function entregar(id){
  const p = S.projetos.find(x => x.id === id);
  if(!p || p.feitas < p.horas) return;
  const resto = p.preco/2;
  S.dinheiro += resto; S.faturadoMes += resto;
  ex('Entrega — '+p.cliente, resto);
  let sat = p.satisfacao;
  if(p.atraso) sat -= 30;
  if(S.hab.execucao > 60) sat += 6;
  sat = cl(sat, 0, 100);
  S.entregues.push({id:p.id, cliente:p.cliente, contato:p.contato, classe:p.classe, satisfacao:sat, quando:S.t, avaliado:false});
  S.projetos = S.projetos.filter(x => x.id !== id);
  S.b.animo = cl(S.b.animo+8,0,100);
  toast('<b>Entregue.</b> '+fmt(resto)+' na conta. Satisfação do cliente: '+Math.round(sat)+'.','v', 7000, 'entrega');
  if(sat < 30) reclamar(p.cliente, 'entregou um sistema ruim');
  render();
}

function atenderChamado(id){
  const c = S.chamados.find(x => x.id === id);
  if(!c) return;
  iniciar('chamado', 'Suporte: '+c.cliente, c.desc, c.horas - c.feitas, {id});
}
function fimChamado(id){
  const c = S.chamados.find(x => x.id === id);
  if(!c) return;
  S.hab.suporte = cl(S.hab.suporte+2,0,100);
  const e = S.entregues.find(x => x.id === c.refId);

  toast('Chamado de '+c.cliente+' resolvido.','v');
}

function pedirAvaliacao(id){
  const e = S.entregues.find(x => x.id === id);
  if(!e) return;
  iniciar('avaliacao', 'Pedindo avaliação', e.cliente, .25, {id});
}
function fimAvaliacao(id){
  const e = S.entregues.find(x => x.id === id);
  if(!e) return;
  e.avaliado = true;
  let n;
  if(e.satisfacao >= 80) n = 5;
  else if(e.satisfacao >= 60) n = 4;

  else toast('<b>'+e.cliente+'</b> deu '+n+' estrela'+(n>1?'s':'')+'. A média não volta mais ao que era.','r', 7000);
}

function responderRA(id){
  const r = S.ra.abertas.find(x => x.id === id);
  if(!r) return;

function zap(de, txt, meu){

const cv = document.getElementById('house');
const cx = cv.getContext('2d');
const W = 400, H = 660;
let escala = 1, alturaLog = H, offY = 0;

function ajustarCanvas(){
  const box = document.getElementById('v-casa');
  const w = Math.round(box.getBoundingClientRect().width) || 400;
  const hd = Math.round(box.getBoundingClientRect().height) || 660;
  escala = w/W;
  alturaLog = Math.max(H, hd/escala);
  offY = (alturaLog - H)/2;
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  cv.width = Math.round(W*escala*dpr); cv.height = Math.round(alturaLog*escala*dpr);
  cv.style.width = w+'px';
  cv.style.height = (alturaLog*escala)+'px';
  cx.setTransform(escala*dpr, 0, 0, escala*dpr, 0, 0);
}

  new ResizeObserver(() => { if(abaAtual === 'casa') ajustarCanvas(); })
    .observe(document.getElementById('v-casa'));

function corCeu(){
  const h = hDia();
  const paleta = [
    [0,  '#101A33'], [5,  '#243356'], [6.5,'#7B6A8C'], [8,  '#9CC6E8'],
    [12, '#B8DCF2'], [17, '#C8CBE0'], [18.5,'#E09A6A'], [20, '#3E4A78'], [22, '#141E38'], [24, '#101A33'],
  ];
  for(let i=0;i<paleta.length-1;i++){
    const [h1,c1] = paleta[i], [h2,c2] = paleta[i+1];
    if(h >= h1 && h <= h2){
      const t = (h-h1)/(h2-h1);
      return mix(c1, c2, t);
    }
  }
  return '#101A33';
}
function mix(a,b,t){
  const p = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  const A = p(a), B = p(b);
  return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';
}
function luzInterna(){
  const h = hDia();
  return (h < 6.5 || h > 18.5) ? 1 : (h < 8 || h > 17 ? .4 : 0);
}

function rr(x,y,w,h,r){
  cx.beginPath();
  const rad = Math.min(r, w/2, h/2);
  cx.moveTo(x+rad,y);
  cx.arcTo(x+w,y,x+w,y+h,rad); cx.arcTo(x+w,y+h,x,y+h,rad);
  cx.arcTo(x,y+h,x,y,rad); cx.arcTo(x,y,x+w,y,rad);
  cx.closePath();
}
function fill(c,x,y,w,h,r){ cx.fillStyle=c; if(r){rr(x,y,w,h,r); cx.fill();} else cx.fillRect(x,y,w,h); }

let bounce = 0;
function desenharCasa(){
  if(document.getElementById('v-casa').classList.contains('on') === false) return;
  bounce += 0.06;
  const ceu = corCeu(), luz = luzInterna();

  cx.setTransform(1,0,0,1,0,0);
  cx.clearRect(0,0,cv.width,cv.height);
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  cx.setTransform(escala*dpr, 0, 0, escala*dpr, 0, 0);
  fill(ceu, 0, 0, W, alturaLog);

  // estrelas de madrugada
  const h = hDia();
  if(h < 5.5 || h > 20){
    cx.fillStyle = 'rgba(255,255,255,.55)';
    for(let i=0;i<34;i++){
      const sx = (i*97)%W, sy = (i*53)%Math.round(alturaLog);
      cx.fillRect(sx, sy, 1.6, 1.6);
    }
  }
  cx.save();
  cx.translate(0, offY);

  COMODOS.forEach((c, i) => {
    const hh = c.y1 - c.y0;
    // parede
    fill('#F2E2C9', 14, c.y0, W-28, hh, 4);
    // sombra suave no topo
    const g = cx.createLinearGradient(0, c.y0, 0, c.y0+50);
    g.addColorStop(0, 'rgba(0,0,0,.10)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = g; cx.fillRect(14, c.y0, W-28, 50);
    // piso
    fill(i===2 ? '#CFE3E6' : '#C4854F', 14, c.piso, W-28, c.y1-c.piso, 0);
    fill('rgba(0,0,0,.13)', 14, c.piso, W-28, 3);
    // rodapé
    fill('#E2CDAE', 14, c.piso-6, W-28, 6);

    // luz de teto acesa
    if(luz > 0){
      const lg = cx.createRadialGradient(W/2, c.y0+10, 5, W/2, c.y0+10, 170);
      lg.addColorStop(0, 'rgba(255,214,140,'+(0.30*luz)+')');
      lg.addColorStop(1, 'rgba(255,214,140,0)');
      cx.fillStyle = lg; cx.fillRect(14, c.y0, W-28, hh);
      fill('#FFD98A', W/2-11, c.y0+2, 22, 7, 3);
    }
    // etiqueta
    cx.fillStyle = 'rgba(70,48,28,.42)';
    cx.font = '700 9px Figtree, sans-serif';
    cx.fillText(c.n, 22, c.y0+16);
  });

  janela(250, 40, 96, 66, ceu);
  janela(30, 250, 84, 62, ceu);

  // ---- móveis
  fogao(); geladeira(); piaCozinha(); mesaCozinha();
  cama(); mesaTrabalho(); sofaTV();
  boxBanho(); piaBanheiro(); vasoSan(); portaSaida();

  if(S.sujeira > 35) desenharSujeira();
  desenharBoneco();
  animacaoDaAcao();
  selo();

  // brilho do móvel tocado
  if(tocado && tocado.until > performance.now()){
    const m = MOVEIS.find(x=>x.id===tocado.id);
    if(m){ cx.strokeStyle = 'rgba(242,160,61,.9)'; cx.lineWidth = 2.5; rr(m.x-4,m.y-4,m.w+8,m.h+8,10); cx.stroke(); }
  }
  cx.restore();
}

  fill('#8C5A33', x-4, y-4, w+8, h+8, 4);

  const sol = hDia()>7 && hDia()<18;
  if(sol){ fill('rgba(255,240,200,.28)', x, y, w, h/2, 2); }
  else { cx.fillStyle='rgba(255,255,255,.5)'; cx.fillRect(x+w-24, y+8, 3,3); cx.fillRect(x+12,y+18,2,2); }
  fill('#8C5A33', x+w/2-2, y, 4, h);

const ICONE_ACAO = {
  dormir:'💤', comer:'🍽️', banho:'🚿', correr:'🏃', mercado:'🛒', limpar:'🧹', tv:'📺',
  tania:'❤️', limpezaTania:'🧽', curso:'🎓', insta:'📱', parado:'😶',
  projeto:'⌨️', chamado:'🛠️', reuniao:'🤝', follow:'💬', avaliacao:'⭐', responderRA:'✍️',
};

// partículas que sobem, com o desenho passado como função
function sobem(x, y, n, periodo, desenho){
  for(let i=0;i<n;i++){
    const t = (bounce*periodo + i/n) % 1;
    const px = x + Math.sin((bounce + i*2.1)*1.6) * 9;
    const py = y - t*46;
    cx.globalAlpha = (1 - t) * .85;
    desenho(px, py, t, i);
  }
  cx.globalAlpha = 1;
}

function animacaoDaAcao(){
  const f = S.fazendo;
  if(!f) return;
  const p = posBoneco();
  const x = p.x, y = p.y - (p.deitado ? 0 : 62);

  switch(f.tipo){
    case 'banho':
      sobem(x, y+8, 6, .5, (px,py,t) => {
        cx.fillStyle = 'rgba(220,240,250,.9)';
        cx.beginPath(); cx.arc(px, py, 3 + t*3, 0, 7); cx.fill();
      });
      break;
    case 'comer':
      sobem(x, y+4, 4, .35, (px,py) => {
        cx.strokeStyle = 'rgba(255,255,255,.6)'; cx.lineWidth = 2;
        cx.beginPath(); cx.moveTo(px, py); cx.quadraticCurveTo(px+5, py-7, px, py-13); cx.stroke();
      });
      break;
    case 'limpar': case 'limpezaTania':
      sobem(x, y+14, 7, .7, (px,py,t) => {
        cx.fillStyle = 'rgba(190,180,160,.75)';
        cx.beginPath(); cx.ellipse(px, py, 4-t*2, 2.5-t, 0, 0, 7); cx.fill();
      });
      break;
    case 'correr':
      for(let i=0;i<3;i++){
        const t = (bounce*1.4 + i/3) % 1;
        cx.globalAlpha = (1-t)*.7; cx.strokeStyle = '#EFE3D0'; cx.lineWidth = 2.4;
        cx.beginPath(); cx.moveTo(x-16-t*20, y+34); cx.lineTo(x-30-t*20, y+34); cx.stroke();
      }
      cx.globalAlpha = 1;
      break;
    case 'tania':
      sobem(x, y, 4, .4, (px,py,t) => {
        const s = 5 - t*2;
        cx.fillStyle = 'rgba(224,122,155,.95)';
        cx.beginPath();
        cx.moveTo(px, py+s*.6);
        cx.bezierCurveTo(px-s, py-s*.4, px-s*.5, py-s*1.3, px, py-s*.5);
        cx.bezierCurveTo(px+s*.5, py-s*1.3, px+s, py-s*.4, px, py+s*.6);
        cx.fill();
      });
      break;
    case 'insta':
      sobem(x, y+10, 5, .55, (px,py,t,i) => {
        cx.fillStyle = i%2 ? 'rgba(224,122,155,.9)' : 'rgba(127,180,232,.9)';
        cx.beginPath(); cx.arc(px, py, 3.2-t, 0, 7); cx.fill();
      });
      break;
    case 'tv': case 'parado':
      sobem(x, y+2, 3, .3, (px,py) => {
        cx.fillStyle = 'rgba(160,175,205,.7)';
        cx.beginPath(); cx.arc(px, py, 2.6, 0, 7); cx.fill();
      });
      break;
    case 'projeto': case 'chamado': case 'curso': case 'responderRA':
      for(let i=0;i<4;i++){
        const t = (bounce*.9 + i/4) % 1;
        cx.globalAlpha = (1-t)*.8;
        cx.fillStyle = ['#7FD4A8','#F2A03D','#7FB3E8','#E07A9B'][i];
        cx.fillRect(x - 14 + i*8, y + 6 - t*34, 5, 2.5);
      }
      cx.globalAlpha = 1;
      break;
    case 'reuniao': case 'follow':
      sobem(x, y, 3, .45, (px,py,t) => {
        cx.fillStyle = 'rgba(240,244,250,.92)';
        rr(px-7, py-6, 15, 10, 4); cx.fill();
        cx.fillStyle = 'rgba(60,70,95,.9)';
        for(let k=0;k<3;k++) cx.fillRect(px-4+k*4, py-1.5, 2, 2);
      });
      break;
    case 'mercado':
      sobem(x, y+6, 3, .35, (px,py) => {
        cx.fillStyle = 'rgba(242,160,61,.9)';
        cx.fillRect(px-4, py-4, 8, 8);
      });
      break;
    case 'dormir': break; // o zZ do boneco já conta a história
  }

  // bolha com o ícone da ação, pairando
  const ic = ICONE_ACAO[f.tipo];
  if(ic){
    const by = y - 22 + Math.sin(bounce*1.5)*2.5;
    const lado = (x > 250 ? -26 : (p.deitado ? 46 : 26));
    const bx = cl(x + lado, 28, 262);
    cx.fillStyle = 'rgba(30,39,64,.92)';
    cx.beginPath(); cx.arc(bx, by, 13, 0, 7); cx.fill();
    cx.strokeStyle = 'rgba(255,255,255,.16)'; cx.lineWidth = 1.5; cx.stroke();
    cx.font = '14px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(ic, bx, by + 1);
    cx.textAlign = 'start'; cx.textBaseline = 'alphabetic';
  }
}

// selo de pendencia em cima da mesa de trabalho
function selo(){
  const n = pendencias();
  if(!n) return;
  const m = MOVEIS[5];
  const x = m.x + m.w - 4, y = m.y - 6;
  cx.fillStyle = 'rgba(0,0,0,.28)';
  cx.beginPath(); cx.arc(x, y+2, 13, 0, 7); cx.fill();
  cx.fillStyle = '#E0503A';
  cx.beginPath(); cx.arc(x, y, 12.5, 0, 7); cx.fill();
  cx.fillStyle = '#fff';
  cx.font = '800 14px Figtree, sans-serif';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText(String(n), x, y+1);
  cx.textAlign = 'start'; cx.textBaseline = 'alphabetic';
}

function desenharSujeira(){
  const n = Math.floor(S.sujeira/12);
  cx.globalAlpha = .55;
  for(let i=0;i<n;i++){
    const c = COMODOS[i%3];
    const x = 30 + ((i*137)%(W-90));
    const y = c.piso - 8 - ((i*29)%10);
    cx.fillStyle = i%3===0 ? '#8A7A66' : (i%3===1 ? '#A2937E' : '#6E6252');
    cx.beginPath(); cx.ellipse(x, y, 7+(i%3)*2, 3.5, 0, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;
}

function posBoneco(){
  const f = S.fazendo;
  const mapa = {dormir:'cama', comer:'mesaCoz', banho:'box', tv:'sofa', limpar:'sofa',
    projeto:'mesaTrab', reuniao:'mesaTrab', follow:'mesaTrab', chamado:'mesaTrab',
    avaliacao:'mesaTrab', responderRA:'mesaTrab', curso:'mesaTrab', tania:'sofa',
    correr:'porta', mercado:'porta', limpezaTania:'porta', insta:'sofa'};
  const id = f ? (mapa[f.tipo]||'mesaTrab') : 'mesaTrab';
  const m = MOVEIS.find(x => x.id === id) || MOVEIS[5];
  // a faixa da direita é dos botões: o boneco e a animação ficam longe dela
  if(id === 'cama')     return {x:m.x+82, y:m.y+40, deitado:true};
  if(id === 'mesaTrab') return {x:m.x+m.w/2, y:MOVEIS[5].y+96};
  if(id === 'sofa')     return {x:m.x-14, y:m.y+42};
  if(id === 'box')      return {x:m.x+m.w/2, y:m.y+112};
  if(id === 'porta')    return {x:m.x-22, y:m.y+m.h-8, fora:true};
  return {x:m.x+m.w/2, y:m.y+m.h+4};
}

function desenharBoneco(){
  const p = posBoneco();
  const f = S.fazendo;
  const bob = (f && ['projeto','chamado','reuniao','follow','limpar'].includes(f.tipo)) ? Math.sin(bounce*2)*1.5 : 0;

  if(p.deitado){
    fill('#4C8FD6', p.x-38, p.y+8, 76, 22, 8);
    fill('#F0C9A0', p.x+30, p.y+4, 17, 17, 8);
    fill('#3B2A20', p.x+30, p.y+2, 17, 8, 4);
    cx.fillStyle='rgba(255,255,255,.75)'; cx.font='600 13px Figtree';
    cx.fillText('z', p.x+52, p.y-2 + Math.sin(bounce)*2);
    cx.fillText('Z', p.x+58, p.y-11 + Math.sin(bounce+1)*2);
    return;
  }
  const y = p.y + bob;
  fill('rgba(0,0,0,.16)', p.x-13, y+1, 26, 6, 4);
  // pernas
  fill('#3A4560', p.x-9, y-20, 7, 21, 3);
  fill('#3A4560', p.x+2,  y-20, 7, 21, 3);
  // tronco
  const cor = S.depre ? '#5C6478' : (S.b.estresse>80 ? '#8E6BD9' : '#4C8FD6');
  fill(cor, p.x-12, y-46, 24, 28, 7);
  // braços
  fill(cor, p.x-17, y-44, 6, 20, 3);
  fill(cor, p.x+11, y-44, 6, 20, 3);
  // cabeça
  fill('#F0C9A0', p.x-9, y-64, 18, 18, 8);
  fill('#3B2A20', p.x-9, y-65, 18, 8, 4);
  // olhos / humor
  cx.fillStyle = '#2A2018';
  if(S.depre || S.b.animo < 25){
    cx.fillRect(p.x-6, y-55, 4, 1.8); cx.fillRect(p.x+2, y-55, 4, 1.8);
    cx.fillRect(p.x-4, y-49, 8, 1.6);
  } else {
    cx.fillRect(p.x-6, y-56, 3, 3); cx.fillRect(p.x+3, y-56, 3, 3);
    cx.strokeStyle = '#2A2018'; cx.lineWidth = 1.4;
    cx.beginPath(); cx.arc(p.x, y-52, 4, .15, Math.PI-.15); cx.stroke();
  }
  if(S.b.estresse > 80){
    cx.fillStyle='#8E6BD9'; cx.font='700 13px Figtree';
    cx.fillText('!', p.x+14, y-58 + Math.sin(bounce*3)*2);
  }
  // celular na mão quando está rolando o feed
  if(f && f.tipo === 'insta'){
    fill('#1A1F2B', p.x+9, y-42, 9, 15, 2);
    fill('#7FB3E8', p.x+10, y-41, 7, 12, 1);
    cx.fillStyle = 'rgba(140,190,240,.35)';
    cx.beginPath(); cx.moveTo(p.x+13, y-41); cx.lineTo(p.x+3, y-55); cx.lineTo(p.x+25, y-55); cx.fill();
  }
}

function corVital(v, invertido){
  const b = invertido ? 100-v : v;
  return b >= 60 ? 'var(--verde)' : (b >= 30 ? 'var(--laranja)' : 'var(--vermelho)');
}
function pendencias(){
  return S.leads.filter(l => ['marcada','orcar','pensando'].includes(l.st)).length
       + S.chamados.length
       + S.projetos.filter(p => p.feitas >= p.horas).length;
}

    vt.dataset.hash = novo;

  montarAcoes();

      sub = c ? dur(Math.max(0,c.horas-c.feitas))+' restante' : '';
    } else {
      pct = (S.t-f.ini)/(f.fim-f.ini)*100;
      sub = dur(Math.max(0, f.fim-S.t))+' restante';

  // as mensagens ficam embaixo, sem cobrir o menu nem a barra da acao em curso
  document.getElementById('toasts').style.bottom = '64px';

  badge('fama', S.ra.abertas.length);
}
function badge(aba, n){
  const el = document.getElementById('bd-'+aba);
  if(!el) return;
  el.style.display = n > 0 ? 'flex' : 'none';
  el.textContent = n;
}

    {id:'banho',   ic:'🚿', n:'Banho',   faz: () => iniciar('banho','No banho','', .35)},
    {id:'correr',  ic:'🏃', n:'Correr',  faz: () => iniciar('correr','Correndo na rua','', 1)},
    {id:'insta',   ic:'📱', n:'Insta',   faz: () => iniciar('insta','Rolando o Instagram','15 minutos', CFG.insta.passo)},
    {id:'tania',   ic:'❤️', n:'Tania',   faz: menuTania},
    {id:'limpar',  ic:'🧹', n:'Limpar',  faz: () => iniciar('limpar','Limpando a casa','a sujeira volta sozinha', 1)},
    {id:'tv',      ic:'📺', n:'TV',      faz: () => iniciar('tv','Vendo TV','descanso', 1)},
    {id:'mercado', ic:'🛒', n:'Mercado', faz: () => iniciar('mercado','No mercado','', CFG.mercado.horas)},
    {id:'curso',   ic:'🎓', n:'Curso',   trava: S.dinheiro < CFG.curso.custo,
                   faz: () => iniciar('curso','Fazendo o curso','+10 de execução', CFG.curso.horas)},
  ];

function montarAcoes(){
  const el = document.getElementById('acoes');
  if(abaAtual !== 'casa'){ el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const lista = acoesDisponiveis();
  const chave = lista.map(a => a.id + (a.selo||'') + (a.trava?'x':'')).join('|');
  if(el.dataset.hash === chave) return;
  el.dataset.hash = chave;
  el.innerHTML = lista.map((a,i) =>
    `<button data-a="${i}" class="${a.destaque?'destaque':''} ${a.trava?'travado':''}">
       <span class="ai">${a.ic}</span><span class="an">${a.n}</span>
       ${a.selo ? `<span class="selo">${a.selo}</span>` : ''}
     </button>`).join('');
  el.querySelectorAll('[data-a]').forEach(b => {
    const a = lista[+b.dataset.a];
    b.onclick = () => { if(a.trava) return toast('Falta dinheiro pra isso.','x'); a.faz(); };
  });
}

function menuComida(){

/* ---------- render das telas ---------- */
let ultimoRender = 0;
function render(leve){
  if(leve && performance.now() - ultimoRender < 400) return;
  ultimoRender = performance.now();
  if(mesaAberta) renderMesa();
  if(abaAtual === 'zap') renderZap();
  if(abaAtual === 'grana') renderGrana();
  if(abaAtual === 'fama') renderFama();
  atualizarHud();
}

function abrirMesa(){
  const box = document.getElementById('sheetBox');
  box.className = 'meia';
  box.innerHTML =
    `<div class="sheetHead"><h2>Mesa de trabalho</h2>
       <span class="pill o" id="mesaPend"></span>
       <button class="fechar" id="mFech" aria-label="Fechar">✕</button></div>
     <div class="sheetScroll" id="mesaBody"></div>`;
  document.getElementById('sheet').classList.add('on');
  mesaAberta = true;
  document.getElementById('mFech').onclick = fecharSheet;
  renderMesa();
}

function renderMesa(){
  const el = document.getElementById('mesaBody');
  if(!el) return;
  const pd = document.getElementById('mesaPend');
  if(pd){ const n = pendencias(); pd.textContent = n ? n+' pendente'+(n>1?'s':'') : 'em dia'; pd.className = 'pill '+(n?'o':'v'); }
  let h = '';
  const M = CFG.mercados[S.mercadoMes];
  const rotMerc = {bom:['Mercado bom','v'], normal:['Mercado normal','o'], ruim:['Mercado ruim','r']};

  h += `<div class="card ${S.mercadoMes==='ruim'?'bad':''}">
    <div class="cardTop"><h3>Agenda</h3>
      <span class="pill ${rotMerc[S.mercadoMes][1]}">${rotMerc[S.mercadoMes][0]}</span></div>
    <div class="meta">Lead custa hoje <b>${fmt(S.custoLead)}</b>. ${S.mercadoMes==='ruim'
      ? 'Caro, pouco e ruim — não dá pra confiar no volume.'
      : (S.mercadoMes==='bom' ? 'Está pingando gente séria.' : 'Chega uma parte do que você pede.')}</div>
    <label class="f">Leads por dia: <b id="ldN">${S.leadsDia}</b> · gasto previsto ${fmt(S.leadsDia*S.custoLead*22)}/mês</label>
    <input type="range" min="0" max="8" value="${S.leadsDia}" id="ldR">
    <div class="acts">
      <button class="btn ${S.agenda?'pri':'gho'}" id="btAg">${S.agenda?'Agenda aberta':'Agenda fechada'}</button>
    </div>
    ${!S.agenda?'<div class="meta" style="margin-top:7px;color:var(--vermelho)">Agenda fechada derruba sua habilidade de Vendas todo dia.</div>':''}
  </div>`;

  // projetos prontos pra entregar
  const prontos = S.projetos.filter(p => p.feitas >= p.horas);
  if(prontos.length){
    h += `<div class="secTit">Pronto pra entregar <span class="n">${prontos.length}</span></div>`;
    prontos.forEach(p => {
      h += `<div class="card good"><div class="cardTop"><h3>${p.cliente}</h3><span class="pill v">${fmt(p.preco/2)} a receber</span></div>
        <div class="meta">${p.pedido} · ${p.contato}</div>
        <div class="acts"><button class="btn pri" data-ent="${p.id}">Entregar e receber</button></div></div>`;
    });
  }

  // reuniões
  const marcadas = S.leads.filter(l => l.st === 'marcada');
  if(marcadas.length){
    h += `<div class="secTit">Reuniões <span class="n">${marcadas.length}</span></div>`;
    marcadas.sort((a,b)=>a.hReuniao-b.hReuniao).forEach(l => {
      const passou = S.t > l.hReuniao;
      const naHora = Math.abs(S.t - l.hReuniao) <= 1;
      h += `<div class="card ${passou?'warn':''}"><div class="cardTop"><h3>${l.empresa}</h3>
        <span class="pill ${naHora?'o':''}">${diaRel(l.hReuniao)} ${hhmm(hDe(l.hReuniao))}</span></div>
        <div class="meta">${l.nome} quer <b>${l.pedido}</b>.${passou?' <b style="color:var(--laranja)">Você passou da hora</b> — ainda dá pra recuperar hoje, mas sem o bônus.':''}</div>
        <div class="acts"><button class="btn pri" data-reu="${l.id}" ${S.t < l.hReuniao-1?'disabled':''}>Fazer a reunião (30 min)</button></div></div>`;
    });
  }

  // orçamentos a enviar
  const orcar = S.leads.filter(l => l.st === 'orcar');
  if(orcar.length){
    h += `<div class="secTit">Mandar orçamento <span class="n">${orcar.length}</span></div>`;
    orcar.forEach(l => {
      h += `<div class="card warn"><div class="cardTop"><h3>${l.empresa}</h3><span class="pill o">${CFG.tipos[l.tipo].nome}</span></div>
        <div class="meta">${l.nome} · ${l.pedido}${l.frio?' · <b style="color:var(--laranja)">ficou morno na reunião</b>':''}</div>
        <div class="acts"><button class="btn pri" data-orc="${l.id}">Definir preço</button></div></div>`;
    });
  }

  // pensando
  const pens = S.leads.filter(l => l.st === 'pensando');
  if(pens.length){
    h += `<div class="secTit">Ficou de pensar <span class="n">${pens.length}</span></div>`;
    pens.forEach(l => {
      h += `<div class="card"><div class="cardTop"><h3>${l.empresa}</h3><span class="pill">${fmt(l.orcamento)}</span></div>
        <div class="meta">${l.nome} · ${l.follows} de ${CFG.followMax} cutucadas</div>
        <div class="acts"><button class="btn pri" data-fol="${l.id}" ${l.follows>=CFG.followMax?'disabled':''}>Cobrar no zap (15 min)</button></div></div>`;
    });
  }

  // projetos em execução
  const emCurso = S.projetos.filter(p => p.feitas < p.horas);
  if(emCurso.length){
    h += `<div class="secTit">Projetos em execução <span class="n">${emCurso.length}</span></div>`;
    emCurso.forEach(p => {
      const falta = p.horas - p.feitas;
      const atraso = S.t > p.prazo;
      const restaPrazo = p.prazo - S.t;
      h += `<div class="card ${atraso?'bad':''}"><div class="cardTop"><h3>${p.cliente}</h3>
        <span class="pill ${atraso?'r':''}">${atraso?'ATRASADO':'faltam '+Math.ceil(restaPrazo/24)+'d'}</span></div>
        <div class="meta">${p.pedido} · ${fmt(p.preco)} · ${dur(falta)} de código</div>
        <div class="prog2"><i style="width:${p.feitas/p.horas*100}%"></i></div>
        <div class="acts">
          <button class="btn pri" data-tra="${p.id}" data-h="2">Codar 2h</button>
          <button class="btn" data-tra="${p.id}" data-h="4">4h</button>
          <button class="btn" data-tra="${p.id}" data-h="8">8h</button>
        </div></div>`;
    });
  }

  // chamados
  if(S.chamados.length){
    h += `<div class="secTit">Suporte <span class="n">${S.chamados.length}</span></div>`;
    S.chamados.forEach(c => {
      const horas = S.t - c.aberto, prazo = c.prazo || 48, resta = prazo - horas;
      const estourou = resta <= 0;
      h += `<div class="card ${c.grande||estourou?'bad':'warn'}"><div class="cardTop"><h3>${c.cliente}</h3>
        <span class="pill ${estourou?'r':(resta<12?'o':'')}">${estourou ? 'passou do prazo' : 'faltam '+Math.round(resta)+'h'}</span></div>
        <div class="meta">${c.desc} · ${dur(c.horas-c.feitas)} de trabalho${c.grande?' · <b style="color:var(--vermelho)">problemão</b>':''}</div>
        <div class="meta" style="color:var(--texto3)">Aberto há ${Math.round(horas)}h · esse cliente espera ${Math.round(prazo)}h${c.classe==='C'?' e reclama fácil':''}</div>
        ${estourou?'<div class="meta" style="color:var(--vermelho)">Já passou. Cada dia agora são 5 de estresse, e ele pode ir pro Reclame Aqui.</div>':''}
        <div class="acts"><button class="btn pri" data-cha="${c.id}">Resolver</button></div></div>`;
    });
  }

  // entregues sem avaliação
  const semAval = S.entregues.filter(e => !e.avaliado);
  if(semAval.length){
    h += `<div class="secTit">Clientes entregues <span class="n">${semAval.length}</span></div>`;
    semAval.forEach(e => {
      const feliz = e.satisfacao >= 80;
      h += `<div class="card"><div class="cardTop"><h3>${e.cliente}</h3>
        <span class="pill ${feliz?'v':(e.satisfacao>=55?'o':'r')}">satisfação ${Math.round(e.satisfacao)}</span></div>
        <div class="meta">${feliz?'Esse aí dá 5 estrelas se você pedir.':(e.satisfacao>=55?'Talvez dê 4. Talvez 3.':'Não peça. Ele vai te dar 1 ou 2.')}</div>
        <div class="acts"><button class="btn ${feliz?'pri':'gho'}" data-ava="${e.id}">Pedir avaliação no Google</button></div></div>`;
    });
  }

  if(!marcadas.length && !orcar.length && !pens.length && !emCurso.length && !S.chamados.length && !prontos.length){
    h += `<div class="vazio">Nada na mesa agora. ${S.agenda?'Os leads pingam durante o dia útil, das 9h às 18h.':'Sua agenda está fechada — nenhum lead vai chegar.'}</div>`;
  }

  el.innerHTML = h;
  const r = document.getElementById('ldR');
  if(r){
    r.oninput = () => { S.leadsDia = +r.value; document.getElementById('ldN').textContent = r.value;
      document.querySelector('#mesaBody label.f').innerHTML = `Leads por dia: <b id="ldN">${S.leadsDia}</b> · gasto previsto ${fmt(S.leadsDia*S.custoLead*22)}/mês`; };
  }
  const ag = document.getElementById('btAg');
  if(ag) ag.onclick = () => { S.agenda = !S.agenda; renderMesa(); };
  el.querySelectorAll('[data-reu]').forEach(b => b.onclick = () => fazerReuniao(+b.dataset.reu));
  el.querySelectorAll('[data-orc]').forEach(b => b.onclick = () => abrirOrcamento(+b.dataset.orc));
  el.querySelectorAll('[data-fol]').forEach(b => b.onclick = () => fazerFollow(+b.dataset.fol));
  el.querySelectorAll('[data-tra]').forEach(b => b.onclick = () => trabalhar(+b.dataset.tra, +b.dataset.h));
  el.querySelectorAll('[data-ent]').forEach(b => b.onclick = () => entregar(+b.dataset.ent));
  el.querySelectorAll('[data-cha]').forEach(b => b.onclick = () => atenderChamado(+b.dataset.cha));
  el.querySelectorAll('[data-ava]').forEach(b => b.onclick = () => pedirAvaliacao(+b.dataset.ava));
}

function renderZap(){
  const el = document.getElementById('zapBody');
  if(!S.zap.length){ el.innerHTML = '<div class="vazio">Nenhuma conversa ainda. O zap enche quando você começa a mandar orçamento e cobrar resposta.</div>'; return; }
  el.innerHTML = S.zap.map(m => `
    <div class="card" style="${m.meu?'margin-left:36px;background:var(--carta2)':'margin-right:36px'}">

      <div class="meta">${m.txt}</div>
    </div>`).join('');
}

function renderGrana(){
  const el = document.getElementById('granaBody');
  const total = CFG.contas.reduce((a,c)=>a+c.v,0);
  const d = agora();
  const diasPra5 = (CFG.diaContas - d.getDate() + 31) % 31;
  const f = nomeFaixa(S.divida);
  let h = '';

  h += `<div class="card">
    <div class="meta">Na conta</div>
    <div class="big" style="color:${S.dinheiro<0?'var(--vermelho)':'var(--verde)'}">${fmt(S.dinheiro)}</div>
    <div class="meta" style="margin-top:6px">Faturado neste mês <b>${fmt(S.faturadoMes)}</b> · gasto com lead <b>${fmt(S.gastoLeadsMes)}</b></div>
  </div>`;

  h += `<div class="secTit">Rendimento</div>
    <div class="card ${S.dinheiro>0?'good':''}">
      <div class="cardTop"><h3>Dinheiro parado rende</h3><span class="pill ${S.dinheiro>0?'v':''}">1% ao mês</span></div>

      <div class="kv"><span>Acumulado no mês</span><span>${fmt(S.rendMes||0)}</span></div>
      <div class="kv"><span>Desde o começo</span><span>${fmt(S.rendTotal||0)}</span></div>
      <div class="meta" style="margin-top:7px;color:var(--texto3)">Só o saldo positivo rende. A dívida corre por fora, e mais rápido.</div>
    </div>`;

  h += `<div class="secTit">Contas do dia 5</div>
    <div class="card ${diasPra5<=3 && S.dinheiro<total ? 'bad':''}">
      ${CFG.contas.map(c=>`<div class="kv"><span>${c.n}</span><span>${fmt(c.v)}</span></div>`).join('')}
      <div class="kv" style="margin-top:4px"><span><b>Total</b></span><span><b>${fmt(total)}</b></span></div>
      <div class="meta" style="margin-top:8px">${diasPra5===0?'<b style="color:var(--laranja)">É hoje.</b>':'Vencem em <b>'+diasPra5+' dia'+(diasPra5>1?'s':'')+'</b>.'}
      ${S.dinheiro < total ? '<b style="color:var(--vermelho)"> Falta '+fmt(total-S.dinheiro)+'.</b>' : ' Você tem com o que pagar.'}</div>
      <div class="meta" style="margin-top:6px;color:var(--texto3)">Comida não entra aqui — sai nas idas ao mercado, ${fmt(CFG.mercado.custo)} por vez.</div>
    </div>`;

  if(S.divida > 0){
    const j = jurosMes();
    h += `<div class="secTit">Dívida</div>
      <div class="card bad">
        <div class="big" style="color:var(--vermelho)">${fmt(S.divida)}</div>
        <div class="meta" style="margin-top:4px">Faixa atual: <b>${f.nome}</b> a ${(f.nome==='Agiota'?taxaAgiota()*100:f.juros*100).toFixed(0)}% ao mês.
        No dia 1 entram <b>${fmt(j)}</b> de juros.</div>
        <div class="acts">
          ${[1000,5000,S.divida].filter((v,i,a)=>v>0 && a.indexOf(v)===i).map(v=>
            `<button class="btn ${v===S.divida?'pri':''}" data-pag="${v}" ${S.dinheiro<Math.min(v,S.divida)?'disabled':''}>Pagar ${v===S.divida?'tudo':fmt(v)}</button>`).join('')}
        </div>
      </div>
      <div class="card">
        ${CFG.divida.map((fx,i)=>{
          const de = i===0?0:CFG.divida[i-1].ate;
          const dentro = S.divida > de;
          const taxa = fx.nome==='Agiota' ? taxaAgiota() : fx.juros;
          return `<div class="kv"><span style="${dentro?'color:var(--vermelho);font-weight:600':'color:var(--texto3)'}">${fx.nome}${fx.ate===Infinity?' (acima de R$ 20 mil)':' (até '+fmt(fx.ate)+')'}</span><span>${(taxa*100).toFixed(0)}%</span></div>`;
        }).join('')}
      </div>`;
  } else {
    h += `<div class="secTit">Dívida</div><div class="card good"><div class="meta">Zerada. Enquanto durar.</div></div>`;
  }

  h += `<div class="secTit">Extrato</div>`;

        const dd = new Date(D0.getTime()+e.t*3600e3);

  el.innerHTML = h;
  el.querySelectorAll('[data-pag]').forEach(b => b.onclick = () => {

    S.dinheiro -= v; S.divida -= v; ex('Abatimento da dívida', -v);
    toast('Abateu '+fmt(v)+'. Falta '+fmt(S.divida)+'.','v');
    renderGrana();
  });
}
